<script>
  const currentUser = ZamSession.requireAuth('../index.html');
  if (!['Owner','Admin','Supervisor'].includes(currentUser.role)) {
      window.location.href = zamRoleHomePath(currentUser.role);
  }

</head>
<body class="bg-background text-on-surface overflow-x-hidden">
<script>document.write(renderZamSidebar('branches', currentUser.role));</script>

<header class="fixed top-0 left-0 w-full md:pr-[280px] h-20 bg-surface-container-lowest border-b border-outline-variant shadow-sm z-40 flex justify-between items-center px-margin-desktop">
  <div>
    <h1 class="font-title-md text-title-md text-primary">إدارة الفروع</h1>
    <p class="text-body-sm text-on-surface-variant">إضافة وتعديل وحذف فروع زام</p>
  </div>
  <button id="add-branch-btn" class="bg-primary text-on-primary rounded-lg px-md py-sm font-bold flex items-center gap-1">
    <span class="material-symbols-outlined text-base">add_business</span> إضافة فرع جديد
  </button>
</header>

<main class="md:pr-[280px] pt-20 min-h-screen">
<div class="max-w-4xl mx-auto p-margin-desktop">

  <div id="branches-list" class="grid grid-cols-1 md:grid-cols-2 gap-md mb-lg">
    <p class="text-on-surface-variant text-body-sm">جارِ التحميل...</p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-md">
    <a href="../dashboard/index.html" class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md hover:border-primary transition-all flex items-center gap-sm">
      <span class="material-symbols-outlined text-primary">insights</span>
      <div><p class="font-bold">أداء الفروع</p><p class="text-[12px] text-on-surface-variant">داشبورد متابعة التشغيل</p></div>
    </a>
    <a href="../manage-templates/index.html" class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md hover:border-primary transition-all flex items-center gap-sm">
      <span class="material-symbols-outlined text-primary">edit_note</span>
      <div><p class="font-bold">قوائم التحقق</p><p class="text-[12px] text-on-surface-variant">إدارة تشيك ليست كل فرع</p></div>
    </a>
    <a href="../staff-management/index.html" class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md hover:border-primary transition-all flex items-center gap-sm">
      <span class="material-symbols-outlined text-primary">groups</span>
      <div><p class="font-bold">الطاقم</p><p class="text-[12px] text-on-surface-variant">موظفو كل فرع</p></div>
    </a>
  </div>

</div>
</main>

<!-- Modal إضافة/تعديل فرع -->
<div id="branch-modal" class="fixed inset-0 bg-inverse-surface/40 hidden items-center justify-center z-50 p-margin-mobile">
  <div class="bg-surface-container-lowest rounded-xl p-md w-full max-w-sm">
    <h3 class="font-title-md text-title-md text-primary mb-md" id="branch-modal-title">فرع جديد</h3>
    <label class="text-body-sm text-on-surface-variant">اسم الفرع</label>
    <input id="branch-name-input" class="w-full border border-outline-variant rounded-lg p-sm mt-xs mb-md" placeholder="مثال: زام - حي النرجس"/>
    <div class="flex gap-sm justify-end">
      <button id="cancel-branch-modal" class="px-md py-sm rounded-lg text-on-surface-variant">إلغاء</button>
      <button id="save-branch-btn" class="px-md py-sm bg-primary text-on-primary rounded-lg font-bold">حفظ</button>
    </div>
  </div>
</div>

<script>
let editingBranchId = null;

function openBranchModal(branch = null) {
    editingBranchId = branch ? branch.id : null;
    document.getElementById('branch-modal-title').textContent = branch ? 'تعديل الفرع' : 'فرع جديد';
    document.getElementById('branch-name-input').value = branch?.name || '';
    document.getElementById('branch-modal').classList.remove('hidden');
    document.getElementById('branch-modal').classList.add('flex');
}
function closeBranchModal() {
    document.getElementById('branch-modal').classList.add('hidden');
    document.getElementById('branch-modal').classList.remove('flex');
}

document.getElementById('add-branch-btn').addEventListener('click', () => openBranchModal());
document.getElementById('cancel-branch-modal').addEventListener('click', closeBranchModal);

document.getElementById('save-branch-btn').addEventListener('click', async () => {
    const name = document.getElementById('branch-name-input').value.trim();
    if (!name) { alert('اكتب اسم الفرع.'); return; }
    try {
        if (editingBranchId) {
            await zamClient.from('branches').update({ name }).eq('id', editingBranchId);
        } else {
            await zamClient.from('branches').insert([{ name }]);
        }
        closeBranchModal();
        await loadBranches();
    } catch (err) {
        console.error(err);
        alert('حدث خطأ أثناء الحفظ. تأكد إن عندك صلاحية "إدارة الفروع".');
    }
});

async function deleteBranch(id, name) {
    if (!confirm(`تأكيد حذف فرع "${name}"؟ ده هيأثر على كل بياناته المرتبطة.`)) return;
    try {
        await zamClient.from('branches').delete().eq('id', id);
        await loadBranches();
    } catch (err) {
        console.error(err);
        alert('تعذّر الحذف. تأكد إن عندك الصلاحية اللازمة.');
    }
}

async function loadBranches() {
    const container = document.getElementById('branches-list');
    try {
        const [branches, staff] = await Promise.all([ZamAPI.getBranches(), ZamAPI.getStaff()]);

        if (!branches.length) {
            container.innerHTML = '<p class="text-on-surface-variant text-body-sm">لا توجد فروع بعد. أضف أول فرع من الأعلى.</p>';
            return;
        }

        container.innerHTML = branches.map(b => {
            const staffCount = staff.filter(s => s.branch_id === b.id && s.status === 'active').length;
            return `
            <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md flex items-center justify-between">
                <div class="flex items-center gap-sm">
                    <div class="w-10 h-10 rounded-lg bg-primary-container flex items-center justify-center text-on-primary-container">
                        <span class="material-symbols-outlined">storefront</span>
                    </div>
                    <div>
                        <p class="font-bold text-on-surface">${b.name}</p>
                        <p class="text-[12px] text-on-surface-variant">${staffCount} موظف نشط</p>
                    </div>
                </div>
                <div class="flex gap-xs">
                    <button class="edit-branch-btn p-1 text-on-surface-variant hover:text-primary" data-id="${b.id}" data-name="${b.name}"><span class="material-symbols-outlined text-[20px]">edit</span></button>
                    <button class="delete-branch-btn p-1 text-error hover:opacity-70" data-id="${b.id}" data-name="${b.name}"><span class="material-symbols-outlined text-[20px]">delete</span></button>
                </div>
            </div>`;
        }).join('');

        container.querySelectorAll('.edit-branch-btn').forEach(btn => {
            btn.addEventListener('click', () => openBranchModal({ id: btn.dataset.id, name: btn.dataset.name }));
        });
        container.querySelectorAll('.delete-branch-btn').forEach(btn => {
            btn.addEventListener('click', () => deleteBranch(btn.dataset.id, btn.dataset.name));
        });
    } catch (err) {
        console.error(err);
        container.innerHTML = '<p class="text-error text-body-sm">تعذّر تحميل الفروع.</p>';
    }
}

loadBranches();
</script>
</body></html>
