<style>

<style id="zam-design-system">
:root {
  --zam-coffee: #33210d;
  --zam-coffee-light: #4b3621;
  --zam-focus: #c0583a;
  --zam-surface: #fcf9f8;
}
body.zam-page {
  font-family: "Tajawal", sans-serif;
  text-rendering: optimizeLegibility;
}
@keyframes zamFadeInUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
@keyframes zamLogoGlow { 0%, 100% { filter: drop-shadow(0 0 3px rgba(192, 88, 58, .20)); } 50% { filter: drop-shadow(0 0 12px rgba(192, 88, 58, .48)); } }

.zam-logo { animation: zamFadeInUp .32s cubic-bezier(.2,.7,.3,1) both; }

.zam-card { transition: transform .16s ease, border-color .16s ease, background-color .16s ease; }
.zam-card:hover { transform: translateY(-1px); border-color: var(--zam-focus) !important; }
.zam-btn, button, [role="button"] { transition: background-color .14s ease, border-color .14s ease; }
.zam-btn:hover, button:hover, [role="button"]:hover { filter: brightness(.98); }
.zam-btn:active, button:active, [role="button"]:active { filter: brightness(.95); }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid rgba(192, 88, 58, .42); outline-offset: 2px; }

</style>
</head><body class="zam-page flex items-center justify-center min-h-screen bg-background">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<main class="w-full max-w-md px-margin-mobile flex flex-col items-center">
<div class="mb-lg flex flex-col items-center text-center">
<div class="w-32 h-40 mb-md relative">

</div>
<h1 class="font-headline-lg text-headline-lg text-primary mb-xs">ZAM Operations System</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">أدخل رمز المرور للمتابعة</p>
</div>
<div class="login-card p-md rounded-xl w-full flex flex-col items-center bg-surface-container-lowest">
<div class="w-full mb-md">
<input autofocus class="w-full p-md text-center text-headline-lg tracking-widest rounded-xl border border-outline-variant bg-surface-container-lowest text-primary focus:outline-none focus:border-primary transition-colors" id="passcode-input" maxlength="6" placeholder="" type="password" inputmode="numeric">
</div>
<p id="error-msg" class="text-error text-body-sm mb-sm hidden">رمز المرور غير صحيح، أو حسابك لسه قيد المراجعة من الإدارة.</p>
<button class="w-full mb-md p-md bg-primary text-on-primary rounded-xl font-title-md hover:bg-primary-container transition-colors" id="login-submit">
            دخول
        </button>
<div class="flex flex-col items-center gap-sm">
<a class="font-label-bold text-label-bold text-outline hover:text-primary transition-colors underline-offset-4 underline" href="forgot-passcode/index.html">
                نسيت رمز المرور؟
            </a>
<a class="font-label-bold text-label-bold text-on-secondary-container hover:text-primary transition-colors underline-offset-4 underline" href="register/index.html">
                تسجيل البيانات لأول مرة
            </a>
</div>
</div>
<div class="mt-xl flex flex-col items-center text-center opacity-70">
<p class="font-label-bold text-label-bold text-on-surface-variant uppercase tracking-widest">
            Operations Management System
        </p>
<div class="flex gap-sm mt-base items-center justify-center">
<span class="material-symbols-outlined text-[18px]">verified_user</span>
<span class="font-body-sm text-body-sm">نظام آمن</span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant opacity-90 font-semibold mt-md">
        إنشاء وتطوير محمود رائد - مدير التشغيل والجودة
    </p>
</div>
</main>
<script>
    const input = document.getElementById('passcode-input');
    const submitBtn = document.getElementById('login-submit');
    const errorMsg = document.getElementById('error-msg');

    // لو المستخدم داخل بالفعل، وديه على صفحته المناسبة حسب دوره
    (function checkExisting() {
        const p = ZamSession.get();
        if (p) window.location.href = zamRoleHomePath(p.role);
    })();

    async function handleLogin() {
        const passcode = input.value.trim();
        if (passcode.length < 4) return;

        errorMsg.classList.add('hidden');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span>';

        try {
            const profile = await ZamAPI.login(passcode);
            ZamSession.save(profile);
            window.location.href = zamRoleHomePath(profile.role);
            return;
        } catch (err) {
            console.error('Login error:', err);
            input.parentElement.classList.add('shake');
            input.classList.add('border-error');
            errorMsg.textContent = err.friendly ? err.message : 'حدث خطأ في الاتصال بقاعدة البيانات. حاول مرة أخرى.';
            errorMsg.classList.remove('hidden');
            setTimeout(() => {
                input.parentElement.classList.remove('shake');
                input.classList.remove('border-error');
                input.value = "";
            }, 400);
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'دخول';
        }
    }

    submitBtn.addEventListener('click', handleLogin);
    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleLogin();
    });
</script>
</body></html>
