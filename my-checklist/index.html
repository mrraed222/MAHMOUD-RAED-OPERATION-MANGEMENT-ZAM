<script>
const ROLE_CATEGORY = { Barista: 'البار', Waiter: 'الصالة', Kitchen: 'المطبخ' };
const isSupervisorLike = ['Owner', 'Admin', 'Supervisor'].includes(currentUser.role);
const myCategory = ROLE_CATEGORY[currentUser.role] || null;

const myCategories = myCategory ? [myCategory] : []; // تُستبدل بالفئات الفعلية من employee_task_categories بعد التحميل

let currentBranchHours = currentUser.branches || {};
const defaultShiftByRiyadhTime = (date = new Date()) =>
  ZamChecklistSchedule.isWithinShiftTaskWindow('Evening', currentBranchHours, date) ? 'Evening' : 'Morning';
document.getElementById('user-branch-label').textContent = currentUser.branches?.name || 'بدون فرع محدد';

let currentShift = ['Morning', 'Evening'].includes(currentUser.shift_type)
  ? currentUser.shift_type
  : defaultShiftByRiyadhTime();
if (!isSupervisorLike) {
  document.querySelectorAll('.shift-btn').forEach(b => b.style.display = b.dataset.shift === currentShift ? '' : 'none');
}

const container = document.getElementById('checklist-container');
const progressLabel = document.getElementById('progress-label');
const categoryLabel = document.getElementById('category-label');
let visibleTemplatesById = new Map();
let restroomTaskConfig = null;
let restroomBranchOperational = false;
let restroomOccurrencesByKey = new Map();
const restroomStepDrafts = new Map();
const restroomPhotoDrafts = new Map();

async function currentBranchIsOperational() {
    if (!currentUser.branch_id) return false;
    await zamClient.auth.getSession();
    const { data: branch, error } = await zamClient.from('branches')
        .select('id, lifecycle_status, planned_opening_date').eq('id', currentUser.branch_id).maybeSingle();
    if (error || !branch) throw error || new Error('تعذّر التحقق من حالة الفرع');
    restroomBranchOperational = ZamBranchLifecycle.isOperational(branch, new Date());
    return restroomBranchOperational;
}

// Refresh current user profile from database on load to ensure we have the absolute latest roles/categories
(async function refreshUserProfile() {
    try {
        // wait for the auth session to be restored before any query,
        // otherwise queries run as anon and multi-category fetch silently fails
        await zamClient.auth.getSession();
        const { data: freshProfile } = await zamClient.from('profiles').select('*, branches(name, opening_time, closing_time)').eq('id', currentUser.id).maybeSingle();
        if (freshProfile) {
            Object.assign(currentUser, freshProfile);
            currentBranchHours = freshProfile.branches || {};
            ZamSession.save(currentUser);
            currentShift = ['Morning', 'Evening'].includes(freshProfile.shift_type)
                ? freshProfile.shift_type
                : defaultShiftByRiyadhTime();
            updateShiftButtons();
            myCategories.length = 0;
            // الفئات تُقرأ من جدول employee_task_categories (يدعم تعدد الفئات)
            let freshCats = [];
            try {
                freshCats = await ZamAPI.getTaskCategories(currentUser.id);
            } catch (e) {
                console.error('Error fetching task categories:', e);
            }
            if (!freshCats.length && myCategory) freshCats = [myCategory];
            freshCats.forEach(c => myCategories.push(c));
            document.getElementById('user-branch-label').textContent = currentUser.branches?.name || 'بدون فرع محدد';
            loadMyChecklist();
            scheduleChecklistRefresh();
        }
    } catch (e) {
        console.error('Error refreshing profile:', e);
    }
})();

function updateShiftButtons() {
    document.querySelectorAll('.shift-btn').forEach(btn => {
        const active = btn.dataset.shift === currentShift;
        btn.classList.toggle('bg-primary', active);
        btn.classList.toggle('text-on-primary', active);
        btn.classList.toggle('text-on-surface-variant', !active);
        if (!isSupervisorLike) btn.style.display = active ? '' : 'none';
    });
}

document.querySelectorAll('.shift-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        currentShift = btn.dataset.shift;
        updateShiftButtons();
        loadMyChecklist();
        scheduleChecklistRefresh();
    });
});

async function uploadEvidence(file) {
    const ext = file.name.split('.').pop() || 'jpg';
    const path = `${currentUser.id}/${Date.now()}.${ext}`;
    const { error } = await zamClient.storage.from('task-evidence').upload(path, file, {
        contentType: file.type || 'image/jpeg',
        upsert: true
    });
    if (error) throw error;
    const { data } = zamClient.storage.from('task-evidence').getPublicUrl(path);
    return data.publicUrl;
}

async function saveTaskCompletion(templateId, notes = null, photo_url = null) {
    if (!(await currentBranchIsOperational())) throw new Error('فرعك غير نشط حتى تاريخ الافتتاح.');
    const task = visibleTemplatesById.get(templateId);
    const visibility = {
        role: currentUser.role,
        branchId: currentUser.branch_id,
        branchName: currentUser.branches?.name,
        branchHours: currentBranchHours,
        categories: myCategories,
        shiftType: currentShift
    };
    if (!task || !ZamChecklistSchedule.isTemplateVisibleForEmployee(task, visibility, new Date())) {
        throw new Error('انتهت مهلة تنفيذ المهمة أو لم تعد مستحقة لهذه الوردية.');
    }
    const base = {
        template_id: templateId,
        branch_id: currentUser.branch_id,
        executed_by: currentUser.id,
        status: 'Completed',
        notes,
        photo_url,
        shift_type: currentShift
    };
    if (task?.frequency === 'hourly') {
        return ZamAPI.submitHourlyChecklistLog(base);
    }
    return ZamAPI.submitChecklistLog(base);
}

async function loadMyChecklist() {
    categoryLabel.textContent = myCategories.length ? `مهامك: ${myCategories.join(' و ')} — ${currentShift === 'Morning' ? 'الوردية الصباحية' : 'الوردية المسائية'}` : 'كل الفئات';
    container.innerHTML = '<p class="p-md text-on-surface-variant text-body-sm">جارِ تحميل المهام...</p>';
    document.getElementById('email-summary-card').classList.add('hidden');

    try {
        if (!(await currentBranchIsOperational())) {
            visibleTemplatesById = new Map();
            document.getElementById('email-summary-card').classList.add('hidden');
            container.innerHTML = '<p class="p-md text-on-surface-variant text-body-sm">قوائم المهام والإرسال غير متاحة قبل تاريخ افتتاح الفرع.</p>';
            progressLabel.textContent = '';
            return;
        }
        const [allTemplatesRaw, config] = await Promise.all([
            ZamAPI.getTemplates(null, currentShift, currentUser.branch_id),
            ZamAPI.getRestroomHourlyTaskConfig()
        ]);
        restroomTaskConfig = config?.is_active ? config : null;
        const allowRestroomForBranch = restroomBranchOperational &&
            !['زام الحي', 'زام البرج'].includes(currentUser.branches?.name);
        const allTemplates = allTemplatesRaw.filter(task => !ZamRestroomHourly.isRestroomHourlyTask(task) ||
            (restroomTaskConfig && allowRestroomForBranch && String(task.id) === String(restroomTaskConfig.template_id)));
        const now = new Date();
        const shiftWindow = ZamChecklistSchedule.getShiftWindow(currentShift, currentBranchHours, now);
        const visibility = {
            role: currentUser.role,
            branchId: currentUser.branch_id,
            branchName: currentUser.branches?.name,
            branchHours: currentBranchHours,
            categories: myCategories,
            shiftType: currentShift
        };
        const scheduledTemplates = allTemplates.filter(t => ZamChecklistSchedule.isTemplateScheduledForEmployee(t, visibility, now));
        const templates = scheduledTemplates.filter(t => ZamChecklistSchedule.isTemplateVisibleForEmployee(t, visibility, now));
        const summaryTemplates = shiftWindow.valid && now.getTime() >= shiftWindow.startAt.getTime()
            ? scheduledTemplates.filter(task => !ZamRestroomHourly.isRestroomHourlyTask(task)) : [];
        visibleTemplatesById = new Map(templates.map(task => [task.id, task]));
        const [logs, hourlyLogs] = await Promise.all([
            ZamAPI.getChecklistLogs({ branchId: currentUser.branch_id, dateFrom: shiftWindow.dateFrom, dateTo: shiftWindow.dateTo, shiftType: currentShift }),
            ZamAPI.getHourlyChecklistLogs({ branchId: currentUser.branch_id, dateFrom: shiftWindow.dateFrom, dateTo: shiftWindow.dateTo, shiftType: currentShift })
        ]);
        const logBelongsToShift = log => {
            const created = Date.parse(log.created_at || '');
            if (Number.isFinite(created)) return created >= shiftWindow.startAt.getTime() && created < shiftWindow.graceEndAt.getTime();
            return String(log.execution_date).slice(0, 10) === shiftWindow.businessDate;
        };
        const logsByTemplate = {};
        logs.forEach(l => {
            if (!logBelongsToShift(l)) return;
            const task = scheduledTemplates.find(item => String(item.id) === String(l.template_id));
            const matchesShift = l.shift_type
                ? l.shift_type === currentShift
                : !!task && task.shift_type !== 'Both' && task.shift_type === currentShift;
            if (matchesShift) logsByTemplate[l.template_id] = l;
        });
        const currentHour = ZamChecklistSchedule.riyadhParts().hour;
        hourlyLogs.forEach(l => {
            const task = scheduledTemplates.find(item => String(item.id) === String(l.template_id));
            if (!ZamRestroomHourly.isRestroomHourlyTask(task) && Number(l.occurrence_hour) === currentHour && l.shift_type === currentShift && logBelongsToShift(l)) {
                logsByTemplate[l.template_id] = l;
            }
        });

        const restroomTask = templates.find(ZamRestroomHourly.isRestroomHourlyTask) || null;
        const restroomLogs = restroomTask
            ? hourlyLogs.filter(log => String(log.template_id) === String(restroomTask.id) && log.shift_type === currentShift)
            : [];
        const restroomOccurrences = restroomTask
            ? ZamRestroomHourly.getShiftOccurrences({
                shiftType: currentShift,
                businessDate: shiftWindow.businessDate,
                activeFrom: restroomTaskConfig?.active_from,
                logs: restroomLogs,
                templateId: restroomTask.id,
                now
            }) : [];
        restroomOccurrencesByKey = new Map(restroomOccurrences.map(item => [
            ZamRestroomHourly.occurrenceKey(restroomTask.id, item.executionDate, item.hour), item
        ]));

        if (!templates.length) {
            const message = summaryTemplates.length
                ? 'انتهت مهلة عرض المهام لهذه الوردية؛ راجع حالة الإنجاز في ملخص الإدارة.'
                : 'لا توجد مهام مستحقة أو متاحة لهذه الوردية الآن.';
            container.innerHTML = `<p class="p-md text-on-surface-variant text-body-sm">${message}</p>`;
            progressLabel.textContent = summaryTemplates.length ? 'انتهت مهلة العرض — تبقى المهام غير المكتملة في الملخص' : '';
        } else {
            const regularTemplates = templates.filter(task => !ZamRestroomHourly.isRestroomHourlyTask(task));
            const done = regularTemplates.filter(t => logsByTemplate[t.id]).length;
            const completedOccurrences = restroomOccurrences.filter(item => item.status === 'completed').length;
            progressLabel.textContent = `${regularTemplates.length ? `المهام الأخرى ${done}/${regularTemplates.length}` : ''}${restroomTask ? `${regularTemplates.length ? ' · ' : ''}مواعيد الحمامات ${completedOccurrences}/10` : ''}`;
        }

        // تفعيل كارت إرسال الإيميل للإدارة
        document.getElementById('email-summary-card').classList.toggle('hidden', !summaryTemplates.length);
        const sendBtn = document.getElementById('send-summary-email-btn');
        sendBtn.onclick = async () => {
            try {
                if (!(await currentBranchIsOperational())) throw new Error('فرعك غير نشط حتى تاريخ الافتتاح.');
            } catch (err) {
                alert('تعذّر التحقق من حالة الفرع؛ لم يتم إرسال التقرير.');
                return;
            }
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<span class="material-symbols-outlined text-sm animate-spin">sync</span> جاري الإرسال...';

            try {
                // جلب إيميلات الأدمن والمالك من قاعدة البيانات بشكل ديناميكي
                const { data: admins } = await zamClient.from('profiles').select('email').in('role', ['Owner', 'Admin']);
                const emails = (admins || []).map(a => a.email).filter(Boolean);

                if (!emails.length) emails.push('operations@zam.sa');

                const completedCount = summaryTemplates.filter(t => logsByTemplate[t.id]).length;

                let tasksHtml = summaryTemplates.map(t => {
                    const comp = !!logsByTemplate[t.id];
                    const log = logsByTemplate[t.id];
                    return `
                        <tr style="border-bottom: 1px solid #e0e0e0;">
                            <td style="padding: 10px; font-weight: bold; color: #1c1b1f; text-align: right;">${t.task_title}</td>
                            <td style="padding: 10px; color: #49454f; text-align: right;">${t.category}</td>
                            <td style="padding: 10px; color: ${comp ? '#2e7d32' : '#c62828'}; font-weight: bold; text-align: right;">
                                ${comp ? '✅ مكتمل' : '❌ غير مكتمل'}
                            </td>
                            <td style="padding: 10px; font-size: 11px; text-align: right;">
                                ${log && log.photo_url ? `<a href="${log.photo_url}" target="_blank" style="color: #6750a4; font-weight: bold; text-decoration: none;">🖼️ عرض الإثبات</a>` : '—'}
                            </td>
                        </tr>
                    `;
                }).join('');

                const htmlContent = `
                    <div dir="rtl" style="font-family: Arial, sans-serif; text-align: right; background-color: #fcf8f2; padding: 20px; border-radius: 12px; border: 1px solid #e6dbcb; max-width: 600px; margin: auto;">
                        <div style="text-align: center; margin-bottom: 20px;">
                            <h2 style="color: #6750a4; margin-top: 10px; font-size: 22px;">ZAM Operations System</h2>
                            <h3 style="color: #49454f; font-size: 16px;">ملخص إنجاز المهام والتشيك ليست اليومية</h3>
                        </div>

                        <div style="background-color: #ffffff; padding: 15px; border-radius: 8px; border: 1px solid #e0e0e0; margin-bottom: 20px; text-align: right;">
                            <p style="margin: 5px 0;"><strong>👤 الموظف:</strong> ${currentUser.full_name}</p>
                            <p style="margin: 5px 0;"><strong>📍 الفرع:</strong> ${currentUser.branches?.name || 'بدون فرع'}</p>
                            <p style="margin: 5px 0;"><strong>⏰ الوردية:</strong> ${currentShift === 'Morning' ? 'الوردية الصباحية' : 'الوردية المسائية'}</p>
                            <p style="margin: 5px 0;"><strong>📅 تاريخ الوردية:</strong> ${shiftWindow.businessDate}</p>
                            <p style="margin: 5px 0;"><strong>📊 نسبة الإنجاز:</strong> تم إنجاز ${completedCount} من أصل ${summaryTemplates.length} مهام</p>
                        </div>

                        <table style="width: 100%; border-collapse: collapse; background-color: #ffffff; border-radius: 8px; overflow: hidden; border: 1px solid #e0e0e0; text-align: right;">
                            <thead>
                                <tr style="background-color: #6750a4; color: #ffffff;">
                                    <th style="padding: 10px; text-align: right;">المهمة</th>
                                    <th style="padding: 10px; text-align: right;">الفئة</th>
                                    <th style="padding: 10px; text-align: right;">الحالة</th>
                                    <th style="padding: 10px; text-align: right;">الإثبات</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${tasksHtml}
                            </tbody>
                        </table>

                        <p style="text-align: center; color: #7a7a7a; font-size: 11px; margin-top: 30px;">
                            هذا البريد تم إرساله تلقائياً من نظام زام للعمليات عبر الدومين المعتمد zam.sa باستخدام Resend.
                        </p>
                    </div>
                `;

                await ZamAPI.sendResendEmail({
                    to: emails,
                    subject: `📊 ملخص تشيك ليست ${currentUser.full_name} - فرع ${currentUser.branches?.name || 'زام'}`,
                    html: htmlContent
                });

                alert('تم إرسال ملخص المهام بالبريد الإلكتروني للإدارة بنجاح! ✓');
                sendBtn.innerHTML = '<span class="material-symbols-outlined text-sm">done</span> تم الإرسال بنجاح';
            } catch (err) {
                console.error(err);
                alert('حدث خطأ أثناء إرسال البريد. تم تسجيل المحاولة في قاعدة البيانات.');
                sendBtn.disabled = false;
                sendBtn.innerHTML = '<span class="material-symbols-outlined text-sm">send</span> إرسال الملخص الآن';
            }
        };

        const checklistEsc = value => String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const checklistWeekDays = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
        const getWeeklyDays = task => {
            const day = Number(task.day_of_week);
            return Number.isInteger(day) && day >= 0 && day <= 6 ? [day] : [];
        };
        function renderRestroomParent(task) {
            const statusStyle = {
                upcoming: 'bg-surface-container text-on-surface-variant',
                open: 'bg-primary-fixed text-on-primary-fixed',
                completed: 'bg-tertiary-fixed/40 text-tertiary',
                missed: 'bg-error-container text-on-error-container',
                beforeActivation: 'bg-surface-container text-on-surface-variant'
            };
            const rows = restroomOccurrences.map(occurrence => {
                const key = ZamRestroomHourly.occurrenceKey(task.id, occurrence.executionDate, occurrence.hour);
                const draft = new Set(restroomStepDrafts.get(key) || []);
                const photoDraft = restroomPhotoDrafts.get(key);
                const allChecked = ZamRestroomHourly.STEP_KEYS.every(step => draft.has(step));
                const deadlineLabel = occurrence.deadlineAt.toLocaleTimeString('ar-SA', {
                    timeZone: 'Asia/Riyadh', hour: '2-digit', minute: '2-digit'
                });
                const statusText = occurrence.status === 'open'
                    ? `متاحة حتى ${checklistEsc(deadlineLabel)} · مهلة 20 دقيقة`
                    : occurrence.status === 'missed'
                        ? 'تنبيه: فات الموعد وأُغلق بعد 20 دقيقة — أبلغ المشرف'
                        : occurrence.status === 'beforeActivation'
                            ? 'قبل بدء تفعيل الجدول'
                            : occurrence.statusLabel;
                const controls = occurrence.status === 'open' ? `
                  <div class="mt-sm grid gap-xs sm:grid-cols-2">
                    ${ZamRestroomHourly.STEPS.map(step => `
                      <label class="flex items-center gap-sm rounded-lg border border-outline-variant bg-surface-container-lowest px-sm py-xs text-body-sm">
                        <input type="checkbox" class="restroom-step h-5 w-5 rounded border-outline accent-primary" data-occurrence-key="${checklistEsc(key)}" data-step-key="${checklistEsc(step.key)}" ${draft.has(step.key) ? 'checked' : ''}/>
                        <span>${checklistEsc(step.label)}</span>
                      </label>`).join('')}
                  </div>
                  <label class="mt-sm flex cursor-pointer items-center gap-xs rounded-lg border border-outline-variant bg-surface-container-lowest px-sm py-xs text-body-sm">
                    <span class="material-symbols-outlined text-primary">photo_camera</span>
                    <span class="restroom-photo-name flex-1" data-occurrence-key="${checklistEsc(key)}">${checklistEsc(photoDraft?.name || 'أرفق صورة إثبات الموعد')}</span>
                    <input type="file" accept="image/*" capture="environment" class="restroom-photo hidden" data-occurrence-key="${checklistEsc(key)}"/>
                  </label>
                  <textarea rows="2" class="restroom-note mt-sm w-full rounded-lg border border-outline-variant p-sm text-body-sm" data-occurrence-key="${checklistEsc(key)}" placeholder="ملاحظة أو نقص (اختياري)"></textarea>
                  <div class="mt-sm flex flex-wrap items-center gap-sm">
                    <button type="button" class="restroom-complete-btn rounded-lg bg-primary px-md py-xs font-bold text-on-primary disabled:cursor-not-allowed disabled:opacity-50" data-occurrence-key="${checklistEsc(key)}" ${allChecked && photoDraft ? '' : 'disabled'}>تسجيل إنجاز موعد ${String(occurrence.hour).padStart(2, '0')}:00</button>
                    <span class="restroom-submit-status text-[11px] text-error" data-occurrence-key="${checklistEsc(key)}" aria-live="polite"></span>
                  </div>` : occurrence.status === 'completed' ? `
                  <ul class="mt-sm grid gap-xs sm:grid-cols-2 text-body-sm text-tertiary">
                    ${ZamRestroomHourly.STEPS.map(step => `<li class="flex items-center gap-xs"><span class="material-symbols-outlined text-sm">check_circle</span>${checklistEsc(step.label)}</li>`).join('')}
                  </ul>
                  ${occurrence.log?.photo_url ? `<a class="mt-xs inline-flex items-center gap-xs text-body-sm text-primary underline" href="${checklistEsc(occurrence.log.photo_url)}" target="_blank" rel="noopener">عرض صورة الإثبات</a>` : ''}
                  ${occurrence.log?.notes ? `<p class="mt-xs text-body-sm text-on-surface-variant">ملاحظة: ${checklistEsc(occurrence.log.notes)}</p>` : ''}` : '';
                return `<details class="rounded-xl border ${occurrence.status === 'missed' ? 'border-error bg-error-container/30' : 'border-outline-variant bg-surface-container-lowest'} p-sm" ${occurrence.status === 'open' ? 'open' : ''}>
                  <summary class="flex cursor-pointer list-none flex-wrap items-center justify-between gap-sm">
                    <span class="font-bold text-on-surface">${String(occurrence.hour).padStart(2, '0')}:00</span>
                    <span class="rounded-full px-sm py-[2px] text-[11px] font-bold ${statusStyle[occurrence.status] || statusStyle.upcoming}">${checklistEsc(statusText)}</span>
                  </summary>
                  ${controls ? `<div class="mt-sm border-t border-outline-variant pt-sm">${controls}</div>` : ''}
                </details>`;
            }).join('');
            return `<article class="rounded-xl border border-primary/30 bg-primary-fixed/10 p-md">
              <div class="mb-sm flex flex-wrap items-start justify-between gap-sm">
                <div><h4 class="font-bold text-on-surface text-body-lg">${checklistEsc(task.task_title)}</h4>
                <p class="mt-xs text-body-sm text-on-surface-variant">10 مواعيد للوردية · كل موعد بسجل مستقل ومهلة 20 دقيقة</p></div>
                <span class="rounded-full bg-primary-container px-sm py-xs text-[11px] font-bold text-on-primary">${currentShift === 'Morning' ? '06:00–15:00' : '16:00–01:00'} الرياض</span>
              </div>
              <div class="space-y-xs">${rows}</div>
            </article>`;
        }

        function renderStaffTask(t) {
            if (ZamRestroomHourly.isRestroomHourlyTask(t)) return renderRestroomParent(t);
            const log = logsByTemplate[t.id];
            const completed = !!log;
            const taskId = checklistEsc(t.id);
            const frequencyLabel = { daily: 'يومي', hourly: 'كل ساعة', weekly: 'أسبوعي', monthly: 'شهري' }[t.frequency || 'daily'];
            const weeklyDay = t.frequency === 'weekly' && getWeeklyDays(t).length
                ? ` · ${getWeeklyDays(t).map(day => checklistWeekDays[day]).join('، ')}` : '';
            return `
            <div class="checklist-item rounded-xl p-md ${completed ? 'bg-tertiary-fixed/10' : 'bg-surface-container-lowest'}">
                <div class="flex items-center justify-between gap-md">
                    <div class="flex items-center gap-md flex-1">
                        <input type="checkbox" class="w-6 h-6 rounded border-outline text-primary focus:ring-primary task-checkbox" data-id="${taskId}" ${completed ? 'checked disabled' : ''}/>
                        <div class="flex-1">
                            <h4 class="font-body-lg font-bold text-on-surface leading-6 ${completed ? 'line-through opacity-60' : ''}">${checklistEsc(t.task_title)}</h4>
                            <div class="mt-xs flex flex-wrap items-center gap-xs">
                              <span class="rounded-full bg-secondary-container px-sm py-[2px] text-[11px] font-bold text-on-secondary-container">${frequencyLabel}${weeklyDay}</span>
                              ${t.target_time ? `<span class="rounded-full bg-warning-container px-sm py-[2px] text-[11px] font-bold text-on-warning">موعد ${checklistEsc(String(t.target_time).slice(0, 5))}</span>` : ''}
                            </div>
                            ${t.frequency === 'hourly' ? '<p class="mt-xs text-body-sm text-secondary">تتكرر كل ساعة — يُسجّل إنجاز الساعة الحالية فقط</p>' : ''}
                            ${t.requires_photo ? '<p class="mt-xs text-body-sm text-on-surface-variant flex items-center gap-1"><span class="material-symbols-outlined text-sm">photo_camera</span> يتطلب صورة إثبات</p>' : ''}
                        </div>
                    </div>
                </div>
                ${!completed ? `
                <div class="mt-sm pr-10 flex items-center gap-sm flex-wrap task-actions" data-id="${taskId}" data-requires-photo="${t.requires_photo}">
                    ${t.requires_photo ? `
                        <label class="flex items-center gap-xs cursor-pointer px-sm py-1 bg-surface-container border border-outline rounded-lg text-[12px] font-bold text-primary hover:bg-surface-container-high transition-all">
                            <span class="material-symbols-outlined text-[16px]">photo_camera</span>
                            <span>ارفق صورة الإثبات</span>
                            <input type="file" accept="image/*" capture="environment" class="hidden evidence-input"/>
                        </label>
                    ` : ''}
                    ${t.allows_notes ? `<textarea rows="2" class="task-note w-full border border-outline-variant rounded-lg p-sm text-body-sm" data-id="${taskId}" placeholder="ملاحظة أو عطل أو نقص (اختياري)"></textarea>` : ''}
                    <span class="task-status text-error text-[11px]"></span>
                    <span class="loading-indicator text-primary text-[11px] font-bold hidden"><span class="material-symbols-outlined animate-spin text-sm">sync</span> جارِ رفع الصورة والحفظ...</span>
                </div>` : ''}
            </div>`;
        }

        const templatesByCategory = new Map();
        templates.forEach(task => {
            const category = task.category || 'مهام أخرى';
            if (!templatesByCategory.has(category)) templatesByCategory.set(category, []);
            templatesByCategory.get(category).push(task);
        });
        const categoryGroups = [...templatesByCategory.entries()].sort(([a], [b]) => a.localeCompare(b, 'ar'));
        const frequencyRank = { daily: 0, hourly: 1, monthly: 2, weekly: 3 };
        const renderCategory = ([category, tasks], index) => {
            const sorted = tasks.slice().sort((a, b) => (frequencyRank[a.frequency || 'daily'] ?? 4) - (frequencyRank[b.frequency || 'daily'] ?? 4)
                || (a.frequency === 'weekly' && b.frequency === 'weekly' ? (getWeeklyDays(a)[0] ?? 0) - (getWeeklyDays(b)[0] ?? 0) : 0));
            const weekly = sorted.filter(task => task.frequency === 'weekly');
            const routine = sorted.filter(task => task.frequency !== 'weekly');
            return `<details class="checklist-category mb-sm overflow-hidden rounded-2xl border border-outline-variant bg-surface-container-lowest shadow-sm" ${index === 0 ? 'open' : ''}>
              <summary class="flex cursor-pointer list-none items-center justify-between gap-sm bg-surface-container-low px-md py-md hover:bg-surface-container transition-colors">
                <span class="flex min-w-0 items-center gap-sm"><span class="material-symbols-outlined text-primary" aria-hidden="true">checklist</span><span class="truncate font-bold text-body-lg text-on-surface">${checklistEsc(category)}</span></span>
                <span class="flex shrink-0 items-center gap-sm text-[12px] font-bold text-on-surface-variant"><span>${tasks.length} مهمة</span><span class="material-symbols-outlined text-primary" aria-hidden="true">expand_more</span></span>
              </summary>
              <div class="space-y-sm p-sm sm:p-md">
                ${routine.length ? `<section><h3 class="mb-xs border-b border-outline-variant pb-xs text-[12px] font-bold text-on-surface-variant">مهام اليوم والمهام الأخرى</h3><div class="space-y-xs">${routine.map(renderStaffTask).join('')}</div></section>` : ''}
                ${weekly.length ? `<section class="border-t border-outline-variant pt-sm"><h3 class="mb-xs text-[12px] font-bold text-primary">القائمة الأسبوعية (${weekly.length})</h3><div class="space-y-xs">${weekly.map(renderStaffTask).join('')}</div></section>` : ''}
              </div>
            </details>`;
        };
        container.innerHTML = templates.length ? categoryGroups.map(renderCategory).join('') : container.innerHTML;

        container.querySelectorAll('.restroom-step').forEach(input => {
            input.addEventListener('change', () => {
                const key = input.dataset.occurrenceKey;
                const selected = new Set(restroomStepDrafts.get(key) || []);
                if (input.checked) selected.add(input.dataset.stepKey);
                else selected.delete(input.dataset.stepKey);
                restroomStepDrafts.set(key, [...selected]);
                const button = [...container.querySelectorAll('.restroom-complete-btn')]
                    .find(item => item.dataset.occurrenceKey === key);
                if (button) button.disabled = !ZamRestroomHourly.STEP_KEYS.every(step => selected.has(step)) || !restroomPhotoDrafts.has(key);
            });
        });

        container.querySelectorAll('.restroom-photo').forEach(input => {
            input.addEventListener('change', () => {
                const key = input.dataset.occurrenceKey;
                const file = input.files?.[0] || null;
                if (file) restroomPhotoDrafts.set(key, file);
                else restroomPhotoDrafts.delete(key);
                const name = [...container.querySelectorAll('.restroom-photo-name')]
                    .find(item => item.dataset.occurrenceKey === key);
                if (name) name.textContent = file?.name || 'أرفق صورة إثبات الموعد';
                const button = [...container.querySelectorAll('.restroom-complete-btn')]
                    .find(item => item.dataset.occurrenceKey === key);
                const steps = new Set(restroomStepDrafts.get(key) || []);
                if (button) button.disabled = !file || !ZamRestroomHourly.STEP_KEYS.every(step => steps.has(step));
            });
        });

        container.querySelectorAll('.restroom-complete-btn').forEach(button => {
            button.addEventListener('click', async () => {
                const key = button.dataset.occurrenceKey;
                const occurrence = restroomOccurrencesByKey.get(key);
                const selected = new Set(restroomStepDrafts.get(key) || []);
                const photoFile = restroomPhotoDrafts.get(key);
                const status = [...container.querySelectorAll('.restroom-submit-status')]
                    .find(item => item.dataset.occurrenceKey === key);
                if (!occurrence || occurrence.status !== 'open' || Date.now() >= occurrence.deadlineAt.getTime()) {
                    if (status) status.textContent = 'انتهت المهلة؛ سُجّل الموعد غير منفذ.';
                    await loadMyChecklist();
                    return;
                }
                if (!ZamRestroomHourly.STEP_KEYS.every(step => selected.has(step))) {
                    if (status) status.textContent = 'أكمل الخطوات الأربع قبل التسجيل.';
                    return;
                }
                if (!photoFile) {
                    if (status) status.textContent = 'أرفق صورة إثبات الموعد قبل التسجيل.';
                    return;
                }
                button.disabled = true;
                button.textContent = 'جارٍ تسجيل الموعد…';
                if (status) status.textContent = '';
                try {
                    const photo_url = await uploadEvidence(photoFile);
                    await ZamAPI.submitRestroomHourlyOccurrence({
                        template_id: [...visibleTemplatesById.values()].find(ZamRestroomHourly.isRestroomHourlyTask)?.id,
                        shift_type: currentShift,
                        steps: ZamRestroomHourly.stepsObjectFromKeys([...selected]),
                        photo_url,
                        notes: [...container.querySelectorAll('.restroom-note')]
                            .find(item => item.dataset.occurrenceKey === key)?.value.trim() || null
                    });
                    restroomStepDrafts.delete(key);
                    restroomPhotoDrafts.delete(key);
                    await loadMyChecklist();
                } catch (err) {
                    console.error(err);
                    if (status) status.textContent = err?.message || 'تعذّر تسجيل الموعد. أعد المحاولة قبل انتهاء المهلة.';
                    button.disabled = Date.now() >= occurrence.deadlineAt.getTime() || !photoFile || !ZamRestroomHourly.STEP_KEYS.every(step => selected.has(step));
                    button.textContent = 'إعادة المحاولة';
                }
            });
        });

        container.querySelectorAll('.evidence-input').forEach(input => {
            input.addEventListener('change', async () => {
                const file = input.files[0];
                if (!file) return;

                const wrap = input.closest('.task-actions');
                const templateId = wrap.dataset.id;
                const statusSpan = wrap.querySelector('.task-status');
                const loader = wrap.querySelector('.loading-indicator');
                const label = wrap.querySelector('label');
                const checkbox = container.querySelector(`.task-checkbox[data-id="${templateId}"]`);

                if (checkbox) checkbox.disabled = true;
                if (label) label.classList.add('hidden');
                if (loader) loader.classList.remove('hidden');
                if (statusSpan) statusSpan.textContent = '';

                try {
                    const photo_url = await uploadEvidence(file);
                    const notes = container.querySelector(`.task-note[data-id="${templateId}"]`)?.value.trim() || null;
                    await saveTaskCompletion(templateId, notes, photo_url);
                    await loadMyChecklist();
                } catch (err) {
                    console.error(err);
                    if (statusSpan) statusSpan.textContent = 'حدث خطأ أثناء رفع الصورة، حاول مرة أخرى.';
                    if (checkbox) {
                        checkbox.disabled = false;
                        checkbox.checked = false;
                    }
                    if (label) label.classList.remove('hidden');
                    if (loader) loader.classList.add('hidden');
                }
            });
        });

        container.querySelectorAll('.task-checkbox').forEach(cb => {
            cb.addEventListener('change', async () => {
                if (!cb.checked) return;
                const wrap = container.querySelector(`.task-actions[data-id="${cb.dataset.id}"]`);
                if (wrap && wrap.dataset.requiresPhoto === 'true') {
                    cb.checked = false;
                    wrap.querySelector('.evidence-input')?.click();
                    return;
                }
                cb.disabled = true;
                try {
                    const notes = container.querySelector(`.task-note[data-id="${cb.dataset.id}"]`)?.value.trim() || null;
                    await saveTaskCompletion(cb.dataset.id, notes);
                    await loadMyChecklist();
                } catch (err) {
                    console.error(err);
                    cb.disabled = false;
                    cb.checked = false;
                }
            });
        });
    } catch (err) {
        console.error(err);
        container.innerHTML = '<p class="p-md text-error text-body-sm">تعذّر تحميل المهام من قاعدة البيانات.</p>';
    }
}



updateShiftButtons();
let checklistRefreshTimeout = null;
function scheduleChecklistRefresh() {
    clearTimeout(checklistRefreshTimeout);
    const now = new Date();
    const baseDelay = Math.min(
        ZamChecklistSchedule.millisecondsUntilNextRiyadhHour(now),
        ZamChecklistSchedule.millisecondsUntilNextVisibilityChange(currentShift, currentBranchHours, now)
    );
    const shiftWindow = ZamChecklistSchedule.getShiftWindow(currentShift, currentBranchHours, now);
    const restroomDelay = restroomTaskConfig && shiftWindow.valid
        ? ZamRestroomHourly.millisecondsUntilNextChange(currentShift, {
            businessDate: shiftWindow.businessDate,
            activeFrom: restroomTaskConfig.active_from,
            now
        }) : null;
    const delay = restroomDelay === null ? baseDelay : Math.min(baseDelay, restroomDelay);
    checklistRefreshTimeout = setTimeout(() => {
        loadMyChecklist().finally(scheduleChecklistRefresh);
    }, delay);
}
loadMyChecklist().finally(scheduleChecklistRefresh);
</script>
