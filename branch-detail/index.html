<style id="zam-design-system">
:root {
  --zam-coffee: #33210d;
  --zam-coffee-light: #4b3621;
  --zam-focus: #c0583a;
  --zam-surface: #fcf9f8;
}
body.zam-page {
  font-family: "Tajawal", sans-serif;
  text-rendering: optimizeLegibility;
}
@keyframes zamFadeInUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
@keyframes zamLogoGlow { 0%, 100% { filter: drop-shadow(0 0 3px rgba(192, 88, 58, .20)); } 50% { filter: drop-shadow(0 0 12px rgba(192, 88, 58, .48)); } }
@keyframes zamSoftPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(192, 88, 58, .22); } 50% { box-shadow: 0 0 0 7px rgba(192, 88, 58, 0); } }
.zam-logo { animation: zamFadeInUp .32s cubic-bezier(.2,.7,.3,1) both; }
body.zam-page main { animation: zamFadeInUp .28s cubic-bezier(.2,.7,.3,1) both; }
.zam-card { transition: transform .16s ease, border-color .16s ease, background-color .16s ease; }
.zam-card:hover { transform: translateY(-1px); border-color: var(--zam-focus) !important; }
.zam-btn, button, [role="button"] { transition: background-color .14s ease, border-color .14s ease; }
.zam-btn:hover, button:hover, [role="button"]:hover { filter: brightness(.98); }
.zam-btn:active, button:active, [role="button"]:active { filter: brightness(.95); }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid rgba(192, 88, 58, .42); outline-offset: 2px; }
.zam-loading { opacity: .82; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; } }

<body class="zam-page bg-background text-on-surface overflow-x-hidden">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/supabase-config.js?v=20260819"></script>
<script>
  const currentUser = ZamSession.requireAuth('../index.html');
  if (!['Owner','Admin','Manager','Supervisor'].includes(currentUser.role)) {
      window.location.href = zamRoleHomePath(currentUser.role);
  }
  const params = new URLSearchParams(window.location.search);
  const branchId = params.get('branch');
  if (currentUser.role === 'Supervisor' && branchId !== currentUser.branch_id) {
      window.location.href = `index.html?branch=${currentUser.branch_id}&name=${encodeURIComponent(currentUser.branches?.name || 'فرعي')}`;
  }
</script>
<div id="sidebar-slot"></div><script>(async()=>{document.getElementById('sidebar-slot').outerHTML=await renderZamSidebar('branches', currentUser.role);})();</script>
<header class="fixed top-0 left-0 w-full md:pr-[312px] h-20 bg-surface-container-lowest border-b border-outline-variant shadow-sm z-40 flex justify-between items-center px-margin-desktop">
  <div class="flex items-center gap-md">
    <a href="../dashboard/index.html" class="text-on-surface-variant hover:text-primary"><span class="material-symbols-outlined">arrow_forward</span></a>
    <div>
      <h1 class="font-title-md text-title-md text-primary" id="branch-title">تفاصيل الفرع</h1>
      <p class="text-body-sm text-on-surface-variant">سجل تدقيق التنفيذ اليومي بالصور</p>
    </div>
  </div>
  <div class="flex items-center gap-md">
    <input type="date" id="date-filter" class="border border-outline-variant rounded-lg px-sm py-xs text-body-sm"/>
    <div id="notif-bell-slot"></div>
  </div>
</header>
<main class="md:pr-[280px] pt-20 min-h-screen"><div class="max-w-4xl mx-auto p-margin-desktop">
  <section class="grid grid-cols-3 gap-md mb-lg">
    <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md text-center">
      <p class="text-body-sm text-on-surface-variant">نسبة الإنجاز</p>
      <p class="text-2xl font-bold text-primary" id="branch-pct">—</p>
    </div>
    <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md text-center">
      <p class="text-body-sm text-on-surface-variant">مبيعات اليوم</p>
      <p class="text-2xl font-bold text-primary" id="branch-sales">—</p>
    </div>
    <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md text-center">
      <p class="text-body-sm text-on-surface-variant">مهام بصور إثبات</p>
      <p class="text-2xl font-bold text-primary" id="branch-photos">—</p>
    </div>
  </section>
  <h2 class="font-title-md text-title-md text-primary mb-sm">سجل التنفيذ</h2>
  <div class="bg-surface-container-lowest rounded-xl border border-outline-variant divide-y divide-outline-variant" id="log-list">
    <p class="p-md text-on-surface-variant text-body-sm">جارِ التحميل...</p>
  </div>
</div></main>
<div id="image-modal" class="fixed inset-0 bg-inverse-surface/90 hidden items-center justify-center z-50 p-margin-mobile">
  <button id="close-image" class="absolute top-4 right-4 text-white hover:text-primary transition-colors"><span class="material-symbols-outlined text-4xl">close</span></button>
  <img id="modal-img" src="" class="max-w-[90vw] max-h-[85vh] rounded-xl object-contain shadow-2xl"/>
</div>
<script>
const branchName = params.get('name') || 'الفرع';
document.getElementById('branch-title').textContent = decodeURIComponent(branchName);

const dateFilter = document.getElementById('date-filter');
dateFilter.value = new Date().toISOString().split('T')[0];
dateFilter.addEventListener('change', loadBranchDetail);

/**
 * تم إصلاح تحميل البيانات: بدل select(*) مع علاقات قد تفشل
 * في Supabase إذا لم تكن FK relationships مُعلنة، نفصل الاستعلامات
 * ونُغني السجلات يدوياً. هذا أكثر مرونة وأقل عرضة للأخطاء.
 */
async function loadBranchDetail() {
    if (!branchId) return;
    const date = dateFilter.value;
    const listEl = document.getElementById('log-list');
    listEl.innerHTML = '<p class="p-md text-on-surface-variant text-body-sm">جارِ التحميل...</p>';

    try {
        // استعلامات منفصلة لتفادي مشاكل العلاقات (FK) في Supabase
        const [logsRes, templates, reportsRes, branchRes] = await Promise.all([
            zamClient.from('checklist_logs').select('*')
                .eq('branch_id', branchId).eq('execution_date', date)
                .order('created_at', { ascending: false }),
            ZamAPI.getTemplates(null, null, branchId),
            zamClient.from('daily_reports').select('total_sales')
                .eq('branch_id', branchId).eq('report_date', date),
            zamClient.from('branches').select('name').eq('id', branchId).maybeSingle()
        ]);

        if (logsRes.error) throw logsRes.error;
        const logs = logsRes.data || [];
        const reports = reportsRes.data || [];

        // خرائط للتغنية اليدوية
        const templateMap = Object.fromEntries(templates.map(t => [t.id, t]));

        // جلب أسماء منفذي المهام (دفعة واحدة لتحسين الأداء)
        const executorIds = [...new Set(logs.map(l => l.executed_by).filter(Boolean))];
        const executorMap = {};
        if (executorIds.length) {
            const { data: executors } = await zamClient
                .from('profiles')
                .select('id, full_name')
                .in('id', executorIds);
            (executors || []).forEach(p => { executorMap[p.id] = p.full_name; });
        }

        const totalSales = reports.reduce((s, r) => s + (Number(r.total_sales) || 0), 0);
        const doneCount = new Set(logs.map(l => l.template_id)).size;
        const pct = templates.length ? Math.round((doneCount / templates.length) * 100) : 0;
        const withPhotos = logs.filter(l => l.photo_url).length;

        document.getElementById('branch-pct').textContent = pct + '%';
        document.getElementById('branch-sales').textContent = totalSales.toLocaleString('ar-EG') + ' ر.س';
        document.getElementById('branch-photos').textContent = withPhotos;

        if (!logs.length) {
            listEl.innerHTML = '<p class="p-md text-on-surface-variant text-body-sm">لا توجد سجلات تنفيذ في هذا التاريخ.</p>';
            return;
        }

        listEl.innerHTML = logs.map(log => {
            const template = templateMap[log.template_id] || {};
            const executorName = executorMap[log.executed_by] || '—';
            return `
            <div class="p-md flex items-center justify-between gap-md">
                <div class="flex items-center gap-md">
                    ${log.photo_url ? `<img src="${log.photo_url}" class="w-14 h-14 rounded-lg object-cover border border-outline-variant cursor-pointer zoomable-img" data-src="${log.photo_url}"/>` : '<div class="w-14 h-14 rounded-lg bg-surface-container flex items-center justify-center"><span class="material-symbols-outlined text-outline">check_circle</span></div>'}
                    <div>
                        <h4 class="font-bold text-on-surface">${template.task_title || 'مهمة'}</h4>
                        <p class="text-body-sm text-on-surface-variant">${template.category || ''} • نفّذها: ${executorName} • ${new Date(log.created_at).toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'})}</p>
                        ${log.notes ? `<p class="text-body-sm text-on-surface-variant italic">"${log.notes}"</p>` : ''}
                    </div>
                </div>
                <span class="text-[11px] font-bold px-sm py-xs rounded-full ${log.status === 'Flagged' ? 'bg-error-container text-on-error-container' : 'bg-tertiary-fixed/20 text-tertiary-container'}">${log.status}</span>
            </div>`;
        }).join('');

        // ربط مستمعي تكبير الصور
        listEl.querySelectorAll('.zoomable-img').forEach(img => {
            img.addEventListener('click', () => {
                document.getElementById('modal-img').src = img.dataset.src;
                document.getElementById('image-modal').classList.remove('hidden');
                document.getElementById('image-modal').classList.add('flex');
            });
        });
    } catch (err) {
        console.error(err);
        listEl.innerHTML = '<p class="p-md text-error text-body-sm">تعذّر تحميل السجل: ' + (err.message || 'خطأ غير معروف') + '</p>';
    }
}

document.getElementById('close-image')?.addEventListener('click', () => {
    document.getElementById('image-modal').classList.add('hidden');
    document.getElementById('image-modal').classList.remove('flex');
});

loadBranchDetail().catch(err => console.error(err));

// تركيب جرس الإشعارات
(async function mountNotifBell() {
    const slot = document.getElementById('notif-bell-slot');
    if (!slot) return;
    slot.innerHTML = await renderNotificationBell();
    attachNotificationBellHandlers();
})();
</script>
</body></html>
