                }

    }catch(_e){}</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/supabase-config.js"></script>
<script>
  const currentUser = ZamSession.requireAuth('../index.html');
</script>
</head>
<body class="bg-background text-on-surface overflow-x-hidden">
<script>document.write(renderZamSidebar('my-checklist', currentUser.role));</script>

<header class="fixed top-0 left-0 w-full md:pr-[280px] h-20 bg-surface-container-lowest border-b border-outline-variant shadow-sm z-40 flex justify-between items-center px-margin-desktop">
  <div class="flex items-center gap-md">
    <img alt="ZAM Logo" class="h-10 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAHYjgc7-eHXckPir6xT6Xzc1JNl0hItkD1yF71b62A5frAA5eteEdI18Mc8RP8ZlZLBF4ZeBhX-d13FeVqvDMi6wKmruamvwo3BGpfLZky0bs6d5Vln2w1n5DqsKfSfWTn5lKXesAQ8Ku_WHvbiG4EAMG6g7aMQxV0vv4RYQOSAhL4G9MOdCjwQ4GQ0_sFmo0xQOpkbT6i04J4U7sctAJexifNjbeQDiJxKxPVIVlZ-HHqUhUj4rUkYRMiCKqwWcdzhw">
    <div>
      <h1 class="font-title-md text-title-md text-primary">مهامي اليومية</h1>
      <p id="user-branch-label" class="text-body-sm text-on-surface-variant">—</p>
    </div>
  </div>
  <div class="flex items-center gap-sm">
    <div class="flex items-center gap-xs bg-surface-container px-sm py-xs rounded-full">
      <button class="shift-btn px-sm py-1 rounded-full text-[11px] font-bold transition-colors" data-shift="Morning">الوردية الصباحية</button>
      <button class="shift-btn px-sm py-1 rounded-full text-[11px] font-bold transition-colors" data-shift="Evening">الوردية المسائية</button>
    </div>
  </div>
</header>

<main class="md:pr-[280px] pt-20 min-h-screen"><div class="max-w-3xl mx-auto p-margin-desktop">
  <div class="bg-surface-container-lowest rounded-xl border border-outline-variant overflow-hidden card-shadow">
    <div class="bg-primary text-on-primary p-md flex justify-between items-center">
      <div>
        <h2 class="font-title-md text-title-md">قائمة مهامك اليوم</h2>
        <p class="text-body-sm opacity-90" id="category-label">—</p>
      </div>
      <span class="text-xs opacity-90" id="progress-label">جارِ التحميل...</span>
    </div>
    <div class="divide-y divide-outline-variant" id="checklist-container">
      <p class="p-md text-on-surface-variant text-body-sm">جارِ تحميل المهام...</p>
    </div>
  </div>

  <div id="email-summary-card" class="mt-md p-md bg-primary-container/20 rounded-xl border border-primary/20 flex flex-col sm:flex-row items-center justify-between gap-md hidden">
    <div>
      <h4 class="font-bold text-on-surface text-body-sm">📧 أرسل تقرير الإنجاز للإدارة</h4>
      <p class="text-[11px] text-on-surface-variant mt-xs">اضغط هنا لإرسال ملخص فوري بالبريد الإلكتروني للشركاء والإدارة عبر Resend.</p>
    </div>
    <button id="send-summary-email-btn" class="bg-primary text-on-primary font-bold px-md py-sm rounded-lg text-body-sm hover:bg-primary-hover shrink-0 flex items-center gap-xs">
      <span class="material-symbols-outlined text-sm">send</span>
      <span>إرسال الملخص الآن</span>
    </button>
  </div>

  <div class="mt-md p-md bg-secondary-container/40 rounded-xl border border-outline-variant text-body-sm text-on-surface-variant">
    لو واجهتك أي مشكلة في التنفيذ، أبلغ مشرف الوردية مباشرة.
  </div>
</div></main>

<script>
const ROLE_CATEGORY = { Barista: 'البار', Waiter: 'الصالة', Kitchen: 'المطبخ' };
const isSupervisorLike = ['Owner', 'Admin', 'Supervisor'].includes(currentUser.role);
const myCategory = ROLE_CATEGORY[currentUser.role] || null;

const myCategories = currentUser.assigned_categories ? currentUser.assigned_categories.split(',').map(s => s.trim()).filter(Boolean) : (myCategory ? [myCategory] : []);

document.getElementById('user-branch-label').textContent = currentUser.branches?.name || 'بدون فرع محدد';

let currentShift = currentUser.shift_type || (new Date().getHours() < 16 ? 'Morning' : 'Evening');
if (!isSupervisorLike) {
  document.querySelectorAll('.shift-btn').forEach(b => b.style.display = b.dataset.shift === currentShift ? '' : 'none');
}

const container = document.getElementById('checklist-container');
const progressLabel = document.getElementById('progress-label');
const categoryLabel = document.getElementById('category-label');

// Refresh current user profile from database on load to ensure we have the absolute latest roles/categories
(async function refreshUserProfile() {
    try {
        const { data: freshProfile } = await zamClient.from('profiles').select('*, branches(name)').eq('id', currentUser.id).maybeSingle();
        if (freshProfile) {
            currentUser = { ...currentUser, ...freshProfile };
            ZamSession.save(currentUser);
            myCategories.length = 0;
            const freshCats = currentUser.assigned_categories ? currentUser.assigned_categories.split(',').map(s => s.trim()).filter(Boolean) : (myCategory ? [myCategory] : []);
            freshCats.forEach(c => myCategories.push(c));
            document.getElementById('user-branch-label').textContent = currentUser.branches?.name || 'بدون فرع محدد';
            loadMyChecklist();
        }
    } catch (e) {
        console.error('Error refreshing profile:', e);
    }
})();

function updateShiftButtons() {
    document.querySelectorAll('.shift-btn').forEach(btn => {
        const active = btn.dataset.shift === currentShift;
        btn.classList.toggle('bg-primary', active);
        btn.classList.toggle('text-on-primary', active);
        btn.classList.toggle('text-on-surface-variant', !active);
    });
}

document.querySelectorAll('.shift-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        currentShift = btn.dataset.shift;
        updateShiftButtons();
        loadMyChecklist();
    });
});

async function uploadEvidence(file) {
    const ext = file.name.split('.').pop() || 'jpg';
    const path = `${currentUser.id}/${Date.now()}.${ext}`;
    const { error } = await zamClient.storage.from('task-evidence').upload(path, file, {
        contentType: file.type || 'image/jpeg',
        upsert: true
    });
    if (error) throw error;
    const { data } = zamClient.storage.from('task-evidence').getPublicUrl(path);
    return data.publicUrl;
}

async function loadMyChecklist() {
    categoryLabel.textContent = myCategories.length ? `مهامك: ${myCategories.join(' و ')} — ${currentShift === 'Morning' ? 'الوردية الصباحية' : 'الوردية المسائية'}` : 'كل الفئات';
    container.innerHTML = '<p class="p-md text-on-surface-variant text-body-sm">جارِ تحميل المهام...</p>';

    try {
        const allTemplates = await ZamAPI.getTemplates(null, currentShift, currentUser.branch_id);
        const templates = myCategories.length ? allTemplates.filter(t => myCategories.includes(t.category)) : allTemplates;
        const logs = await ZamAPI.getTodayLogs(currentUser.branch_id);
        const logsByTemplate = {};
        logs.forEach(l => { logsByTemplate[l.template_id] = l; });

        if (!templates.length) {
            container.innerHTML = '<p class="p-md text-on-surface-variant text-body-sm">لا توجد مهام مسندة لهذه الوردية حالياً.</p>';
            progressLabel.textContent = '';
            return;
        }

        const done = templates.filter(t => logsByTemplate[t.id]).length;
        progressLabel.textContent = `تم إنجاز ${done} من ${templates.length} مهام`;

        // تفعيل كارت إرسال الإيميل للإدارة
        document.getElementById('email-summary-card').classList.remove('hidden');
        const sendBtn = document.getElementById('send-summary-email-btn');
        sendBtn.onclick = async () => {
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<span class="material-symbols-outlined text-sm animate-spin">sync</span> جاري الإرسال...';

            try {
                // جلب إيميلات الأدمن والمالك من قاعدة البيانات بشكل ديناميكي
                const { data: admins } = await zamClient.from('profiles').select('email').in('role', ['Owner', 'Admin']);
                const emails = (admins || []).map(a => a.email).filter(Boolean);

                if (!emails.length) emails.push('operations@zam.sa');

                const completedCount = templates.filter(t => logsByTemplate[t.id]).length;

                let tasksHtml = templates.map(t => {
                    const comp = !!logsByTemplate[t.id];
                    const log = logsByTemplate[t.id];
                    return `
                        <tr style="border-bottom: 1px solid #e0e0e0;">
                            <td style="padding: 10px; font-weight: bold; color: #1c1b1f; text-align: right;">${t.task_title}</td>
                            <td style="padding: 10px; color: #49454f; text-align: right;">${t.category}</td>
                            <td style="padding: 10px; color: ${comp ? '#2e7d32' : '#c62828'}; font-weight: bold; text-align: right;">
                                ${comp ? '✅ مكتمل' : '❌ غير مكتمل'}
                            </td>
                            <td style="padding: 10px; font-size: 11px; text-align: right;">
                                ${log && log.photo_url ? `<a href="${log.photo_url}" target="_blank" style="color: #6750a4; font-weight: bold; text-decoration: none;">🖼️ عرض الإثبات</a>` : '—'}
                            </td>
                        </tr>
                    `;
                }).join('');

                const htmlContent = `
                    <div dir="rtl" style="font-family: Arial, sans-serif; text-align: right; background-color: #fcf8f2; padding: 20px; border-radius: 12px; border: 1px solid #e6dbcb; max-width: 600px; margin: auto;">
                        <div style="text-align: center; margin-bottom: 20px;">
                            <h2 style="color: #6750a4; margin-top: 10px; font-size: 22px;">ZAM Speciality Coffee</h2>
                            <h3 style="color: #49454f; font-size: 16px;">ملخص إنجاز المهام والتشيك ليست اليومية</h3>
                        </div>

                        <div style="background-color: #ffffff; padding: 15px; border-radius: 8px; border: 1px solid #e0e0e0; margin-bottom: 20px; text-align: right;">
                            <p style="margin: 5px 0;"><strong>👤 الموظف:</strong> ${currentUser.full_name}</p>
                            <p style="margin: 5px 0;"><strong>📍 الفرع:</strong> ${currentUser.branches?.name || 'بدون فرع'}</p>
                            <p style="margin: 5px 0;"><strong>⏰ الوردية:</strong> ${currentShift === 'Morning' ? 'الوردية الصباحية' : 'الوردية المسائية'}</p>
                            <p style="margin: 5px 0;"><strong>📊 نسبة الإنجاز:</strong> تم إنجاز ${completedCount} من أصل ${templates.length} مهام</p>
                        </div>

                        <table style="width: 100%; border-collapse: collapse; background-color: #ffffff; border-radius: 8px; overflow: hidden; border: 1px solid #e0e0e0; text-align: right;">
                            <thead>
                                <tr style="background-color: #6750a4; color: #ffffff;">
                                    <th style="padding: 10px; text-align: right;">المهمة</th>
                                    <th style="padding: 10px; text-align: right;">الفئة</th>
                                    <th style="padding: 10px; text-align: right;">الحالة</th>
                                    <th style="padding: 10px; text-align: right;">الإثبات</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${tasksHtml}
                            </tbody>
                        </table>

                        <p style="text-align: center; color: #7a7a7a; font-size: 11px; margin-top: 30px;">
                            هذا البريد تم إرساله تلقائياً من نظام زام للعمليات عبر الدومين المعتمد zam.sa باستخدام Resend.
                        </p>
                    </div>
                `;

                await ZamAPI.sendResendEmail({
                    to: emails,
                    subject: `📊 ملخص تشيك ليست ${currentUser.full_name} - فرع ${currentUser.branches?.name || 'زام'}`,
                    html: htmlContent
                });

                alert('تم إرسال ملخص المهام بالبريد الإلكتروني للإدارة بنجاح! ✓');
                sendBtn.innerHTML = '<span class="material-symbols-outlined text-sm">done</span> تم الإرسال بنجاح';
            } catch (err) {
                console.error(err);
                alert('حدث خطأ أثناء إرسال البريد. تم تسجيل المحاولة في قاعدة البيانات.');
                sendBtn.disabled = false;
                sendBtn.innerHTML = '<span class="material-symbols-outlined text-sm">send</span> إرسال الملخص الآن';
            }
        };

        container.innerHTML = templates.map(t => {
            const log = logsByTemplate[t.id];
            const completed = !!log;
            return `
            <div class="checklist-item p-md ${completed ? 'bg-tertiary-fixed/10' : ''}">
                <div class="flex items-center justify-between gap-md">
                    <div class="flex items-center gap-md flex-1">
                        <input type="checkbox" class="w-6 h-6 rounded border-outline text-primary focus:ring-primary task-checkbox" data-id="${t.id}" ${completed ? 'checked disabled' : ''}/>
                        <div class="flex-1">
                            <h4 class="font-body-lg font-bold text-on-surface ${completed ? 'line-through opacity-60' : ''}">${t.task_title}</h4>
                            ${t.requires_photo ? '<p class="text-body-sm text-on-surface-variant flex items-center gap-1"><span class="material-symbols-outlined text-sm">photo_camera</span> يتطلب صورة إثبات</p>' : ''}
                        </div>
                    </div>
                </div>
                ${!completed ? `
                <div class="mt-xs pr-10 flex items-center gap-sm flex-wrap task-actions" data-id="${t.id}" data-requires-photo="${t.requires_photo}">
                    ${t.requires_photo ? `
                        <label class="flex items-center gap-xs cursor-pointer px-sm py-1 bg-surface-container border border-outline rounded-lg text-[12px] font-bold text-primary hover:bg-surface-container-high transition-all">
                            <span class="material-symbols-outlined text-[16px]">photo_camera</span>
                            <span>ارفق صورة الإثبات</span>
                            <input type="file" accept="image/*" capture="environment" class="hidden evidence-input"/>
                        </label>
                    ` : ''}
                    <span class="task-status text-error text-[11px]"></span>
                    <span class="loading-indicator text-primary text-[11px] font-bold hidden"><span class="material-symbols-outlined animate-spin text-sm">sync</span> جارِ رفع الصورة والحفظ...</span>
                </div>` : ''}
            </div>`;
        }).join('');


        container.querySelectorAll('.evidence-input').forEach(input => {
            input.addEventListener('change', async () => {
                const file = input.files[0];
                if (!file) return;

                const wrap = input.closest('.task-actions');
                const templateId = wrap.dataset.id;
                const statusSpan = wrap.querySelector('.task-status');
                const loader = wrap.querySelector('.loading-indicator');
                const label = wrap.querySelector('label');
                const checkbox = container.querySelector(`.task-checkbox[data-id="${templateId}"]`);

                if (checkbox) checkbox.disabled = true;
                if (label) label.classList.add('hidden');
                if (loader) loader.classList.remove('hidden');
                if (statusSpan) statusSpan.textContent = '';

                try {
                    const photo_url = await uploadEvidence(file);
                    await ZamAPI.submitChecklistLog({
                        template_id: templateId,
                        branch_id: currentUser.branch_id,
                        executed_by: currentUser.id,
                        status: 'Completed',
                        photo_url
                    });
                    await loadMyChecklist();
                } catch (err) {
                    console.error(err);
                    if (statusSpan) statusSpan.textContent = 'حدث خطأ أثناء رفع الصورة، حاول مرة أخرى.';
                    if (checkbox) {
                        checkbox.disabled = false;
                        checkbox.checked = false;
                    }
                    if (label) label.classList.remove('hidden');
                    if (loader) loader.classList.add('hidden');
                }
            });
        });

        container.querySelectorAll('.task-checkbox').forEach(cb => {
            cb.addEventListener('change', async () => {
                if (!cb.checked) return;
                const wrap = container.querySelector(`.task-actions[data-id="${cb.dataset.id}"]`);
                if (wrap && wrap.dataset.requiresPhoto === 'true') {
                    cb.checked = false;
                    wrap.querySelector('.evidence-input')?.click();
                    return;
                }
                cb.disabled = true;
                try {
                    await ZamAPI.submitChecklistLog({
                        template_id: cb.dataset.id,
                        branch_id: currentUser.branch_id,
                        executed_by: currentUser.id,
                        status: 'Completed'
                    });
                    await loadMyChecklist();
                } catch (err) {
                    console.error(err);
                    cb.disabled = false;
                    cb.checked = false;
                }
            });
        });
    } catch (err) {
        console.error(err);
        container.innerHTML = '<p class="p-md text-error text-body-sm">تعذّر تحميل المهام من قاعدة البيانات.</p>';
    }
}



updateShiftButtons();
loadMyChecklist();
</script>
</body></html>
