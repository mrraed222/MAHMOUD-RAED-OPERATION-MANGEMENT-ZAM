<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سجل زيارات الفروع | Operations Expert</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/supabase-config.js"></script><style>body{font-family:Tahoma,sans-serif;background:#f7f3ef;color:#24170c}.card{background:#fff;border:1px solid #e5d9cf;border-radius:18px;box-shadow:0 8px 24px #4b362110}.brand{background:linear-gradient(120deg,#24170c,#76583d);color:#fff}.muted{color:#71655c}.badge{border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}.open{background:#fff0ed;color:#8d332c}.progress{background:#fff8dc;color:#71520a}.closed{background:#e9f7ed;color:#19623a}@media print{.no-print{display:none!important}body{background:#fff}.card{box-shadow:none}}</style></head><body><script>const currentUser=ZamSession.requireAuth('../index.html');if(!currentUser||!['Owner','Admin','Manager','Quality','Quality Manager'].includes(currentUser.role)){window.location.href=zamRoleHomePath(currentUser&&currentUser.role)}</script><header class="brand p-6"><div class="max-w-7xl mx-auto mb-3 flex items-center justify-between gap-3"><img src="../assets/logo/zam-logo.png" alt="شعار زام" class="h-20 w-auto object-contain bg-white rounded-xl p-1 shadow-sm"><a href="../dashboard/index.html" title="الصفحة الأساسية" aria-label="الصفحة الأساسية" class="no-print w-9 h-9 rounded-full bg-white/20 border border-white/40 text-white inline-flex items-center justify-center hover:bg-white/30 transition"><svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></a></div><div class="max-w-7xl mx-auto flex justify-between items-center gap-4 flex-wrap"><div><p class="opacity-75">Operations Expert</p><h1 class="text-3xl font-black">سجل زيارات الفروع</h1><p class="opacity-85 mt-1">عرض الزيارات السابقة ومتابعة الإجراءات حتى الإغلاق</p></div><div class="no-print flex gap-2"><a href="../branch-visits-new/index.html" class="bg-white text-[#33210d] rounded-full px-4 py-2 font-bold">تسجيل زيارة جديدة</a><button id="print" class="border border-white/50 rounded-full px-4 py-2">طباعة السجل</button></div></div></header><main class="max-w-7xl mx-auto p-5 md:p-8 space-y-6"><section class="card p-5 no-print"><div class="grid md:grid-cols-4 gap-3"><label>من<input id="from" type="date" class="w-full border rounded-lg p-2 mt-1"></label><label>إلى<input id="to" type="date" class="w-full border rounded-lg p-2 mt-1"></label><label>الفرع<select id="branch" class="w-full border rounded-lg p-2 mt-1"><option value="">كل الفروع</option></select></label><label>بحث<input id="search" placeholder="الزائر أو الملاحظة" class="w-full border rounded-lg p-2 mt-1"></label></div><div class="flex gap-2 mt-4"><button id="apply" class="bg-[#33210d] text-white rounded-full px-5 py-2 font-bold">تطبيق</button><button id="reload" class="border rounded-full px-5 py-2">تحديث</button></div></section><section class="grid md:grid-cols-4 gap-4"><div class="card p-4"><small class="muted">الزيارات</small><strong id="visitsCount" class="block text-3xl mt-1">—</strong></div><div class="card p-4"><small class="muted">متوسط التقييم</small><strong id="avgScore" class="block text-3xl mt-1">—</strong></div><div class="card p-4"><small class="muted">إجراءات مفتوحة</small><strong id="openCount" class="block text-3xl mt-1 text-[#8d332c]">—</strong></div><div class="card p-4"><small class="muted">مغلقة</small><strong id="closedCount" class="block text-3xl mt-1 text-[#19623a]">—</strong></div></section><section id="list" class="space-y-4"><div class="card p-6 text-center">جارٍ التحميل…</div></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let visits=[];const statusClass=s=>s==='مغلقة'?'closed':s==='قيد المعالجة'?'progress':'open';async function loadBranches(){const{data,error}=await zamClient.from('branches').select('id,name').order('name');if(error)throw error;branch.innerHTML='<option value="">كل الفروع</option>'+data.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}async function load(){list.innerHTML='<div class="card p-6 text-center">جارٍ التحميل…</div>';let q=zamClient.from('supervisory_visits').select('id,branch_id,visit_date,shift_type,visitor_name,status,score_percentage,score_total,score_possible,signed_at,branches(name),supervisory_visit_notes(id,note_text,status,owner,due_date),visit_action_items(id,title,description,item_type,priority,assigned_role,due_date,status)').order('visit_date',{ascending:false});if(from.value)q=q.gte('visit_date',from.value);if(to.value)q=q.lte('visit_date',to.value);if(branch.value)q=q.eq('branch_id',branch.value);const{data,error}=await q.limit(1000);if(error)throw error;visits=data||[];render()}function render(){const term=search.value.trim().toLowerCase();const filtered=visits.filter(v=>!term||JSON.stringify(v).toLowerCase().includes(term));const all=filtered.flatMap(v=>v.visit_action_items||[]);visitsCount.textContent=filtered.length;const scored=filtered.filter(v=>v.score_percentage!=null);avgScore.textContent=scored.length?Math.round(scored.reduce((a,v)=>a+Number(v.score_percentage),0)/scored.length)+'%':'—';openCount.textContent=all.filter(a=>!['مغلقة','ملغاة'].includes(a.status)).length;closedCount.textContent=all.filter(a=>a.status==='مغلقة').length;list.innerHTML=filtered.length?filtered.map(v=>{const acts=v.visit_action_items||[];return `<article class="card p-5"><div class="flex justify-between gap-3 flex-wrap"><div><h2 class="text-xl font-bold">${esc(v.branches?.name||'فرع غير محدد')}</h2><p class="muted">${esc(v.visit_date)} · ${v.shift_type==='Morning'?'صباحي':'مسائي'} · ${esc(v.visitor_name||'—')}</p></div><div class="text-left"><b class="text-3xl text-[#76583d]">${v.score_percentage==null?'—':Number(v.score_percentage).toFixed(0)+'%'}</b><div class="muted text-sm">${esc(v.status||'مسودة')}</div></div></div><div class="mt-4 grid md:grid-cols-3 gap-3"><div class="bg-[#f7f3ef] rounded-xl p-3"><small class="muted">الدرجة</small><b class="block">${v.score_total??'—'} / ${v.score_possible??'—'}</b></div><div class="bg-[#f7f3ef] rounded-xl p-3"><small class="muted">الإجراءات</small><b class="block">${acts.length}</b></div><div class="bg-[#f7f3ef] rounded-xl p-3"><small class="muted">التوقيع</small><b class="block">${v.signed_at?'معتمدة':'غير معتمدة'}</b></div></div>${acts.length?`<div class="mt-4"><h3 class="font-bold mb-2">الإجراءات والتكليفات</h3><div class="space-y-2">${acts.map(a=>`<div class="border rounded-xl p-3 flex justify-between gap-3 flex-wrap"><div><b>${esc(a.title)}</b><p class="muted text-sm">${esc(a.description||'')} · ${esc(a.assigned_role||'غير مسند')}</p></div><div class="flex gap-2 items-center"><span class="badge ${statusClass(a.status)}">${esc(a.status)}</span><select class="action-status border rounded-lg p-1 no-print" data-id="${a.id}"><option>مفتوحة</option><option>قيد المعالجة</option><option>بانتظار اعتماد</option><option>مغلقة</option><option>ملغاة</option></select><button class="save-action bg-[#33210d] text-white rounded-lg px-3 py-1 no-print" data-id="${a.id}">حفظ</button></div></div>`).join('')}</div></div>`:''}<div class="mt-4 text-right"><button class="border rounded-full px-4 py-2 no-print" onclick="printVisit('${v.id}')">طباعة الزيارة</button></div></article>`}).join(''):'<div class="card p-8 text-center muted">لا توجد زيارات مطابقة للفلاتر.</div>'}async function updateAction(id,select){const{error}=await zamClient.from('visit_action_items').update({status:select.value,closed_at:select.value==='مغلقة'?new Date().toISOString():null,closed_by:select.value==='مغلقة'?currentUser.id:null,updated_at:new Date().toISOString()}).eq('id',id);if(error){alert(error.message);return}await load()}function printVisit(id){const v=visits.find(x=>x.id===id);if(!v)return;const w=window.open('','_blank');w.document.write(`<html dir="rtl"><head><title>زيارة ${esc(v.branches?.name)}</title><style>body{font-family:Tahoma;padding:30px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #ddd;padding:8px;text-align:right}</style></head><body><h1>تقرير زيارة فرع</h1><h2>${esc(v.branches?.name||'')}</h2><p>التاريخ: ${esc(v.visit_date)} | الزائر: ${esc(v.visitor_name||'')}</p><h3>النتيجة: ${v.score_percentage==null?'—':Number(v.score_percentage).toFixed(0)+'%'}</h3><table><tr><th>الإجراء</th><th>الأولوية</th><th>المسؤول</th><th>الحالة</th></tr>${(v.visit_action_items||[]).map(a=>`<tr><td>${esc(a.title)}</td><td>${esc(a.priority)}</td><td>${esc(a.assigned_role||'')}</td><td>${esc(a.status)}</td></tr>`).join('')}</table><script>window.print()<\/script></body></html>`);w.document.close()}apply.onclick=load;reload.onclick=load;search.oninput=render;print.onclick=()=>window.print();list.addEventListener('click',e=>{const b=e.target.closest('.save-action');if(b)updateAction(b.dataset.id,b.parentElement.querySelector('.action-status'))});Promise.all([loadBranches(),load()]).catch(e=>list.innerHTML=`<div class="card p-6 text-red-700">تعذر التحميل: ${esc(e.message)}</div>`)</script></body></html>
