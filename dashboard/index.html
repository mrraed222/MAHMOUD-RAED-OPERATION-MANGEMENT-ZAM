<body class="bg-background text-on-surface overflow-x-hidden">
<div id="sidebar-slot"></div><script>(async()=>{document.getElementById('sidebar-slot').outerHTML=await renderZamSidebar('dashboard', currentUser.role);})();</script>

<header class="fixed top-0 left-0 w-full md:pr-[280px] h-20 bg-surface-container-lowest border-b border-outline-variant shadow-sm z-40 flex justify-between items-center px-margin-desktop">
  <div class="flex items-center gap-md">

      <h1 class="font-title-md text-title-md text-primary">داشبورد متابعة التشغيل</h1>

<main class="md:pr-[280px] pt-20 min-h-screen"><div class="max-w-6xl mx-auto p-margin-desktop">
  <section class="grid grid-cols-2 md:grid-cols-4 gap-md mb-lg" id="summary-cards">
    <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md">

    </div>

      <p class="text-body-sm text-on-surface-variant">مبيعات اليوم (كل الفروع)</p>
      <p class="text-2xl font-bold text-primary" id="today-sales">—</p>
    </div>
    <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md">
      <p class="text-body-sm text-on-surface-variant">مشاكل شفت مفتوحة اليوم</p>
      <p class="text-2xl font-bold text-error" id="open-issues">—</p>
    </div>
  </section>

  <h2 class="font-title-md text-title-md text-primary mb-sm">أداء الفروع</h2>
  <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-md" id="branch-cards">
    <p class="text-on-surface-variant text-body-sm">جارِ التحميل...</p>
  </section>
</div></main>

<script>
document.getElementById('date-label').textContent = new Date().toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
if (currentUser.role === 'Owner') {
    document.getElementById('permissions-link').classList.remove('hidden');
}

async function loadDashboard() {
    const today = new Date().toISOString().split('T')[0];

    const [branches, templates, todayLogsRes, todayReportsRes, openIssuesRes] = await Promise.all([
        ZamAPI.getBranches(),
        ZamAPI.getTemplates(),
        zamClient.from('checklist_logs').select('branch_id, template_id, photo_url, status, created_at, profiles(full_name)').eq('execution_date', today),
        zamClient.from('daily_reports').select('branch_id, total_sales').eq('report_date', today),
        zamClient.from('shift_issues').select('id, branch_id').gte('created_at', today)
    ]);

    const todayLogs = todayLogsRes.data || [];
    const todayReports = todayReportsRes.data || [];
    const openIssues = openIssuesRes.data || [];

    const totalSales = todayReports.reduce((s, r) => s + (Number(r.total_sales) || 0), 0);

    document.getElementById('branch-count').textContent = branches.length;
    document.getElementById('today-sales').textContent = totalSales.toLocaleString('ar-EG') + ' ر.س';
    document.getElementById('open-issues').textContent = openIssues.length;

    const cardsEl = document.getElementById('branch-cards');
    let sumPct = 0;

    cardsEl.innerHTML = branches.map(branch => {
        // قوالب هذا الفرع = القوالب العامة + القوالب الخاصة بيه فقط (التشيك ليست ممكن يختلف من فرع لآخر)
        const branchTemplates = templates.filter(t => !t.branch_id || t.branch_id === branch.id);
        const logsForBranch = todayLogs.filter(l => l.branch_id === branch.id);
        const doneTemplateIds = new Set(logsForBranch.map(l => l.template_id));
        const pct = branchTemplates.length ? Math.round((doneTemplateIds.size / branchTemplates.length) * 100) : 0;
        sumPct += pct;
        const salesForBranch = todayReports.filter(r => r.branch_id === branch.id).reduce((s, r) => s + (Number(r.total_sales) || 0), 0);
        const color = pct >= 80 ? 'text-tertiary-container' : pct >= 50 ? 'text-primary' : 'text-error';
        const barColor = pct >= 80 ? 'bg-tertiary-container' : pct >= 50 ? 'bg-primary' : 'bg-error';


        return `
        <a href="../branch-detail/index.html?branch=${branch.id}&name=${encodeURIComponent(branch.name)}"
           class="block bg-surface-container-lowest border border-outline-variant rounded-xl p-md hover:shadow-md hover:border-primary transition-all">
            <div class="flex justify-between items-start mb-sm">
                <h3 class="font-title-md text-title-md text-on-surface">${branch.name}</h3>
                <span class="text-xl font-bold ${color}">${pct}%</span>
            </div>
            <div class="w-full bg-surface-container-high rounded-full h-2 mb-sm">
                <div class="${barColor} h-2 rounded-full" style="width:${pct}%"></div>
            </div>
            <div class="flex justify-between text-body-sm text-on-surface-variant">
                <span>${doneTemplateIds.size} من ${branchTemplates.length} مهمة</span>
                <span>${salesForBranch.toLocaleString('ar-EG')} ر.س اليوم</span>
            </div>
        </a>`;
    }).join('');

    document.getElementById('avg-completion').textContent = branches.length ? Math.round(sumPct / branches.length) + '%' : '—';
}

loadDashboard().catch(err => {
    console.error(err);
    document.getElementById('branch-cards').innerHTML = '<p class="text-error text-body-sm">تعذّر تحميل بيانات الفروع.</p>';
});


</script>
