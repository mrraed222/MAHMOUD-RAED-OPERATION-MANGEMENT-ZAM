<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/supabase-config.js?v=20260817"></script>
<script>
  const currentUser = ZamSession.requireAuth('../index.html');
  if (!['Owner','Admin'].includes(currentUser.role)) {
      window.location.href = zamRoleHomePath(currentUser.role);
  }
</script>
</head>
<body class="bg-background text-on-surface overflow-x-hidden">
<script>document.write(renderZamSidebar('reports-monitor', currentUser.role));</script>

<header class="fixed top-0 left-0 w-full md:pr-[280px] h-20 bg-surface-container-lowest border-b border-outline-variant shadow-sm z-40 flex justify-between items-center px-margin-desktop">
  <div>
    <h1 class="font-title-md text-title-md text-primary">متابعة تقارير المشرفين</h1>
    <p class="text-body-sm text-on-surface-variant">هل كل فرع سلّم تقاريره اليوم؟</p>
  </div>
  <input type="date" id="check-date" class="border border-outline-variant rounded-lg p-sm"/>
</header>

<main class="md:pr-[280px] pt-20 min-h-screen">
<div class="max-w-4xl mx-auto p-margin-desktop">

  <div class="grid grid-cols-2 md:grid-cols-4 gap-md mb-lg">
    <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md text-center">
      <p class="text-body-sm text-on-surface-variant">سلّموا الصباحي</p>
      <p class="text-2xl font-bold text-tertiary-container" id="c-morning-done">—</p>
    </div>
    <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md text-center">
      <p class="text-body-sm text-on-surface-variant">متأخرين الصباحي</p>
      <p class="text-2xl font-bold text-error" id="c-morning-missing">—</p>
    </div>
    <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md text-center">
      <p class="text-body-sm text-on-surface-variant">سلّموا المسائي</p>
      <p class="text-2xl font-bold text-tertiary-container" id="c-evening-done">—</p>
    </div>
    <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md text-center">
      <p class="text-body-sm text-on-surface-variant">متأخرين المسائي</p>
      <p class="text-2xl font-bold text-error" id="c-evening-missing">—</p>
    </div>
  </div>

  <div class="bg-surface-container-lowest rounded-xl border border-outline-variant overflow-hidden">
    <table class="w-full text-body-sm">
      <thead class="bg-surface-container text-on-surface-variant">
        <tr>
          <th class="p-sm text-right">الفرع</th>
          <th class="p-sm text-right">الوردية الصباحية</th>
          <th class="p-sm text-right">الوردية المسائية</th>
        </tr>
      </thead>
      <tbody id="monitor-tbody"><tr><td colspan="3" class="p-md text-center text-on-surface-variant">جارِ التحميل...</td></tr></tbody>
    </table>
  </div>
</div>
</main>

<script>
document.getElementById('check-date').value = new Date().toISOString().split('T')[0];
document.getElementById('check-date').addEventListener('change', loadMonitor);

function statusBadge(submitted, time) {
    if (submitted) {
        return `<span class="inline-flex items-center gap-1 text-tertiary-container font-bold text-[12px]"><span class="material-symbols-outlined text-[16px]">check_circle</span> تم (${time || ''})</span>`;
    }
    return `<span class="inline-flex items-center gap-1 text-error font-bold text-[12px]"><span class="material-symbols-outlined text-[16px]">error</span> لم يُرسل بعد</span>`;
}

async function loadMonitor() {
    const date = document.getElementById('check-date').value;
    const tbody = document.getElementById('monitor-tbody');
    tbody.innerHTML = '<tr><td colspan="3" class="p-md text-center text-on-surface-variant">جارِ التحميل...</td></tr>';

    try {
        const [branches, reportsRes] = await Promise.all([
            ZamAPI.getBranches(),
            zamClient.from('daily_reports').select('branch_id, shift_type, entry_time').eq('report_date', date)
        ]);
        const reports = reportsRes.data || [];

        let morningDone = 0, morningMissing = 0, eveningDone = 0, eveningMissing = 0;

        tbody.innerHTML = branches.map(b => {
            const morning = reports.find(r => r.branch_id === b.id && r.shift_type === 'Morning');
            const evening = reports.find(r => r.branch_id === b.id && r.shift_type === 'Evening');
            morning ? morningDone++ : morningMissing++;
            evening ? eveningDone++ : eveningMissing++;

            return `
                <tr class="border-t border-outline-variant">
                    <td class="p-sm font-bold">${b.name}</td>
                    <td class="p-sm">${statusBadge(!!morning, morning?.entry_time?.slice(0,5))}</td>
                    <td class="p-sm">${statusBadge(!!evening, evening?.entry_time?.slice(0,5))}</td>
                </tr>`;
        }).join('');

        document.getElementById('c-morning-done').textContent = morningDone;
        document.getElementById('c-morning-missing').textContent = morningMissing;
        document.getElementById('c-evening-done').textContent = eveningDone;
        document.getElementById('c-evening-missing').textContent = eveningMissing;
    } catch (err) {
        console.error(err);
        tbody.innerHTML = '<tr><td colspan="3" class="p-md text-center text-error">تعذّر تحميل البيانات.</td></tr>';
    }
}

loadMonitor();
</script>
</body></html>
