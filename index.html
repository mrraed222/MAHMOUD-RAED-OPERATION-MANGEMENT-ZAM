<h1 class="font-headline-lg text-headline-lg text-primary mb-xs">ZAM Operations System</h1>

</div>
<p class="font-body-sm text-body-sm text-on-surface-variant opacity-90 font-semibold mt-md">
        إنشاء وتطوير محمود رائد - مدير التشغيل والجودة
    </p>
</div>
</main>
<script>
    const input = document.getElementById('passcode-input');
    const submitBtn = document.getElementById('login-submit');
    const errorMsg = document.getElementById('error-msg');

    // لو المستخدم داخل بالفعل، وديه على صفحته المناسبة حسب دوره
    (function checkExisting() {
        const p = ZamSession.get();
        if (p) window.location.href = zamRoleHomePath(p.role);
    })();

    async function handleLogin() {
        const passcode = input.value.trim();
        if (passcode.length < 4) return;

        errorMsg.classList.add('hidden');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span>';

        try {
            const profile = await ZamAPI.login(passcode);
            ZamSession.save(profile);
            window.location.href = zamRoleHomePath(profile.role);
            return;
        } catch (err) {
            console.error('Login error:', err);
            input.parentElement.classList.add('shake');
            input.classList.add('border-error');
            errorMsg.textContent = err.friendly ? err.message : 'حدث خطأ في الاتصال بقاعدة البيانات. حاول مرة أخرى.';
            errorMsg.classList.remove('hidden');
            setTimeout(() => {
                input.parentElement.classList.remove('shake');
                input.classList.remove('border-error');
                input.value = "";
            }, 400);
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'دخول';
        }
    }

    submitBtn.addEventListener('click', handleLogin);
    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleLogin();
    });
</script>
