<!DOCTYPE html>
<html dir="rtl" lang="ar"><head>
<meta charset="utf-8">
<title>تشخيص الجلسة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js?v=20260815"></script>
</head>
<body class="p-8 font-mono text-lg" style="background:#fff;color:#111">
<h2>Session Diagnostics</h2>
<pre id="out">running...</pre>
<script>
(async () => {
  const lines = [];
  try {
    const { data: session, error: se } = await zamClient.auth.getSession();
    lines.push('session error: ' + JSON.stringify(se));
    lines.push('has session: ' + !!session?.session);
    if (session?.session) {
      lines.push('user id: ' + session.session.user?.id);
      lines.push('expires_at: ' + session.session.expires_at);
    }
    const { data: prof, error: pe } = await zamClient.from('profiles').select('full_name').eq('id', currentUser.id).maybeSingle();
    lines.push('profiles err: ' + JSON.stringify(pe));
    lines.push('profile row: ' + JSON.stringify(prof));
    const { data: cats, error: ce } = await zamClient.from('employee_task_categories').select('category').eq('profile_id', currentUser.id);
    lines.push('cats err: ' + JSON.stringify(ce));
    lines.push('categories: ' + JSON.stringify(cats));
  } catch (e) {
    lines.push('EXCEPTION: ' + String(e));
  }
  document.getElementById('out').textContent = lines.join('\n');
})();
</script>
</body></html>
