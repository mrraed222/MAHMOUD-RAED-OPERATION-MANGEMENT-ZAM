<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/supabase-config.js?v=20260815"></script>
<script>
  const currentUser = ZamSession.requireAuth('../index.html');
</script>
</head>
<body class="bg-background text-on-surface overflow-x-hidden">
<script>document.write(renderZamSidebar('employee-profile', currentUser.role));</script>

<header class="fixed top-0 left-0 w-full md:pr-[280px] h-20 bg-surface-container-lowest border-b border-outline-variant shadow-sm z-40 flex justify-between items-center px-margin-desktop">
  <div>
    <h1 class="font-title-md text-title-md text-primary">الملف الشخصي</h1>
    <p class="text-body-sm text-on-surface-variant">بياناتك وأداؤك في النظام</p>
  </div>
</header>

<main class="md:pr-[280px] pt-20 min-h-screen">
<div class="max-w-3xl mx-auto p-margin-desktop">

  <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-lg flex items-center gap-md mb-lg">
    <div class="relative shrink-0">
      <img id="avatar-img" alt="صورة شخصية" class="w-20 h-20 rounded-full object-cover border-4 border-surface-container bg-surface-container" src=""/>
      <button id="change-avatar-btn" title="تغيير الصورة الشخصية" class="absolute bottom-0 left-0 w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-lg hover:bg-primary-container transition-colors">
        <span class="material-symbols-outlined text-[18px]">photo_camera</span>
      </button>
      <input type="file" id="avatar-input" accept="image/*" class="hidden"/>
    </div>
    <div>
      <h2 class="font-title-md text-title-md text-on-surface" id="p-name">—</h2>
      <p class="text-body-sm text-on-surface-variant" id="p-role-branch">—</p>
      <p class="text-[12px] text-on-surface-variant" id="p-number">—</p>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-md mb-lg">
    <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md">
      <h3 class="font-title-md text-title-md text-primary mb-sm flex items-center gap-sm"><span class="material-symbols-outlined">contact_mail</span> بيانات التواصل</h3>
      <p class="text-body-sm text-on-surface-variant">البريد الإلكتروني: <span id="p-email" class="text-on-surface font-bold">—</span></p>
      <p class="text-body-sm text-on-surface-variant mt-xs">الواتساب: <span id="p-whatsapp" class="text-on-surface font-bold">—</span></p>
    </div>
    <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md">
      <h3 class="font-title-md text-title-md text-primary mb-sm flex items-center gap-sm"><span class="material-symbols-outlined">task_alt</span> أداء آخر 7 أيام</h3>
      <p class="text-2xl font-bold text-primary" id="p-completion-count">—</p>
      <p class="text-[12px] text-on-surface-variant">مهمة تم تنفيذها</p>
    </div>
  </div>

  <div id="supervisor-section" class="hidden mb-lg">
    <h3 class="font-title-md text-title-md text-primary mb-sm">آخر التقارير المُرسلة</h3>
    <div id="my-reports-list" class="bg-surface-container-lowest border border-outline-variant rounded-xl divide-y divide-outline-variant"></div>
  </div>

</div>
</main>

<script>
const ROLE_LABELS = { Owner: 'مالك النظام', Admin: 'أدمن', Supervisor: 'مشرف وردية', Barista: 'باريستا', Kitchen: 'مطبخ', Waiter: 'خدمة' };

document.getElementById('p-name').textContent = currentUser.full_name;
document.getElementById('p-role-branch').textContent = `${ROLE_LABELS[currentUser.role] || currentUser.role} — ${currentUser.branches?.name || 'بدون فرع'}`;
document.getElementById('p-number').textContent = currentUser.employee_number ? `الرقم الوظيفي: ${currentUser.employee_number}` : '';
document.getElementById('p-email').textContent = currentUser.email || '—';
document.getElementById('p-whatsapp').textContent = currentUser.whatsapp_number || '—';
document.getElementById('avatar-img').src = currentUser.avatar_url || "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23e4e2e1'/><circle cx='50' cy='38' r='18' fill='%2380756c'/><ellipse cx='50' cy='88' rx='30' ry='22' fill='%2380756c'/></svg>";

// تغيير الصورة الشخصية: رفع إلى bucket ثم تحديث profiles وتحديث الجلسة
document.getElementById('change-avatar-btn')?.addEventListener('click', () => {
    document.getElementById('avatar-input').click();
});
document.getElementById('avatar-input')?.addEventListener('change', async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    // make sure the auth session is ready before upload+update
    await zamClient.auth.getSession();
    const btn = document.getElementById('change-avatar-btn');
    btn.disabled = true;
    try {
        const ext = file.name.split('.').pop() || 'jpg';
        const path = `${currentUser.id}/${Date.now()}.${ext}`;
        const { error: upErr } = await zamClient.storage.from('avatars').upload(path, file, { upsert: true });
        if (upErr) throw upErr;
        const { data } = zamClient.storage.from('avatars').getPublicUrl(path);
        const { error: dbErr } = await zamClient.from('profiles').update({ avatar_url: data.publicUrl }).eq('id', currentUser.id);
        if (dbErr) throw dbErr;
        currentUser.avatar_url = data.publicUrl;
        ZamSession.save(currentUser);
        document.getElementById('avatar-img').src = data.publicUrl + '?t=' + Date.now();
    } catch (err) {
        console.error(err);
        alert('تعذّر تحديث الصورة الشخصية: ' + (err.message || 'خطأ غير معروف'));
    } finally {
        btn.disabled = false;
        e.target.value = '';
    }
});

async function loadPerformance() {
    try {
        const weekAgo = new Date();
        weekAgo.setDate(weekAgo.getDate() - 7);
        const { data, error } = await zamClient
            .from('checklist_logs')
            .select('id')
            .eq('executed_by', currentUser.id)
            .gte('execution_date', weekAgo.toISOString().split('T')[0]);
        if (error) throw error;
        document.getElementById('p-completion-count').textContent = data.length;
    } catch (err) {
        console.error(err);
        document.getElementById('p-completion-count').textContent = '—';
    }
}

async function loadMyReports() {
    if (!['Owner', 'Admin', 'Supervisor'].includes(currentUser.role)) return;
    document.getElementById('supervisor-section').classList.remove('hidden');
    const list = document.getElementById('my-reports-list');
    try {
        const { data, error } = await zamClient
            .from('daily_reports')
            .select('*, branches(name)')
            .eq('supervisor_name', currentUser.full_name)
            .order('report_date', { ascending: false })
            .limit(10);
        if (error) throw error;

        if (!data.length) {
            list.innerHTML = '<p class="p-md text-on-surface-variant text-body-sm">لا توجد تقارير مرسلة بعد.</p>';
            return;
        }
        list.innerHTML = data.map(r => `
            <div class="p-sm flex justify-between items-center">
                <div>
                    <p class="font-bold text-on-surface text-body-sm">${r.branches?.name || '—'} — ${r.report_date}</p>
                    <p class="text-[12px] text-on-surface-variant">${r.shift_type === 'Morning' ? 'صباحي' : 'مسائي'} • ${r.total_sales} ر.س</p>
                </div>
                <span class="text-[11px] text-on-surface-variant">${r.team_status || ''}</span>
            </div>
        `).join('');
    } catch (err) {
        console.error(err);
        list.innerHTML = '<p class="p-md text-error text-body-sm">تعذّر تحميل التقارير.</p>';
    }
}

loadPerformance();
loadMyReports();
</script>
</body></html>
