<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
  const currentUser = ZamSession.requireAuth('../index.html');
  if (!['Owner','Admin'].includes(currentUser.role)) {
      window.location.href = zamRoleHomePath(currentUser.role);
  }

</head>
<body class="bg-background text-on-surface overflow-x-hidden">
<script>document.write(renderZamSidebar('analytics', currentUser.role));</script>

<header class="fixed top-0 left-0 w-full md:pr-[280px] h-20 bg-surface-container-lowest border-b border-outline-variant shadow-sm z-40 flex justify-between items-center px-margin-desktop">
  <div>
    <h1 class="font-title-md text-title-md text-primary">داشبورد التحليلات</h1>
    <p class="text-body-sm text-on-surface-variant">الهدر ومشاكل الشفت — قابلة للفلترة والتصدير</p>
  </div>
</header>

<main class="md:pr-[280px] pt-20 min-h-screen">
<div class="max-w-6xl mx-auto p-margin-desktop">

  <!-- الفلاتر -->
  <section class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md mb-lg grid grid-cols-1 md:grid-cols-5 gap-sm items-end">
    <div>
      <label class="text-body-sm text-on-surface-variant">الفرع</label>
      <select id="f-branch" class="w-full border border-outline-variant rounded-lg p-sm mt-xs">
        <option value="">كل الفروع (مجمّع)</option>
      </select>
    </div>
    <div>
      <label class="text-body-sm text-on-surface-variant">الفترة</label>
      <select id="f-preset" class="w-full border border-outline-variant rounded-lg p-sm mt-xs">
        <option value="7">آخر 7 أيام</option>
        <option value="30" selected>آخر 30 يوم</option>
        <option value="90">آخر 3 شهور</option>
        <option value="365">آخر سنة</option>
        <option value="custom">فترة مخصصة</option>
      </select>
    </div>
    <div id="custom-from-wrap" class="hidden">
      <label class="text-body-sm text-on-surface-variant">من تاريخ</label>
      <input type="date" id="f-from" class="w-full border border-outline-variant rounded-lg p-sm mt-xs"/>
    </div>
    <div id="custom-to-wrap" class="hidden">
      <label class="text-body-sm text-on-surface-variant">إلى تاريخ</label>
      <input type="date" id="f-to" class="w-full border border-outline-variant rounded-lg p-sm mt-xs"/>
    </div>
    <button id="apply-filters" class="bg-primary text-on-primary rounded-lg p-sm font-bold">تطبيق الفلتر</button>
  </section>

  <!-- ملخص الهدر -->
  <section class="mb-lg">
    <div class="flex justify-between items-center mb-sm">
      <h2 class="font-title-md text-title-md text-primary">الهدر</h2>
      <button id="export-waste" class="text-body-sm font-bold text-primary hover:underline flex items-center gap-1">
        <span class="material-symbols-outlined text-base">download</span> تصدير Excel
      </button>
    </div>
    <div id="waste-summary" class="grid grid-cols-2 md:grid-cols-4 gap-md mb-sm"></div>
    <div class="bg-surface-container-lowest rounded-xl border border-outline-variant overflow-x-auto">
      <table class="w-full text-body-sm">
        <thead class="bg-surface-container text-on-surface-variant">
          <tr><th class="p-sm text-right">التاريخ</th><th class="p-sm text-right">الفرع</th><th class="p-sm text-right">الصنف</th><th class="p-sm text-right">الكمية</th><th class="p-sm text-right">السبب</th></tr>
        </thead>
        <tbody id="waste-tbody"><tr><td colspan="5" class="p-md text-center text-on-surface-variant">جارِ التحميل...</td></tr></tbody>
      </table>
    </div>
  </section>

  <!-- مشاكل الشفت -->
  <section class="mb-lg">
    <div class="flex justify-between items-center mb-sm">
      <h2 class="font-title-md text-title-md text-primary">مشاكل الشفت</h2>
      <button id="export-issues" class="text-body-sm font-bold text-primary hover:underline flex items-center gap-1">
        <span class="material-symbols-outlined text-base">download</span> تصدير Excel
      </button>
    </div>
    <div class="bg-surface-container-lowest rounded-xl border border-outline-variant overflow-x-auto">
      <table class="w-full text-body-sm">
        <thead class="bg-surface-container text-on-surface-variant">
          <tr><th class="p-sm text-right">التاريخ</th><th class="p-sm text-right">الفرع</th><th class="p-sm text-right">النوع</th><th class="p-sm text-right">الوصف</th><th class="p-sm text-right">الأولوية</th></tr>
        </thead>
        <tbody id="issues-tbody"><tr><td colspan="5" class="p-md text-center text-on-surface-variant">جارِ التحميل...</td></tr></tbody>
      </table>
    </div>
  </section>

</div>
</main>

<script>
let wasteData = [];
let issuesData = [];

document.getElementById('f-preset').addEventListener('change', (e) => {
    const isCustom = e.target.value === 'custom';
    document.getElementById('custom-from-wrap').classList.toggle('hidden', !isCustom);
    document.getElementById('custom-to-wrap').classList.toggle('hidden', !isCustom);
});

function getDateRange() {
    const preset = document.getElementById('f-preset').value;
    if (preset === 'custom') {
        return { from: document.getElementById('f-from').value || null, to: document.getElementById('f-to').value || null };
    }
    const to = new Date();
    const from = new Date();
    from.setDate(from.getDate() - parseInt(preset));
    return { from: from.toISOString().split('T')[0], to: to.toISOString().split('T')[0] };
}

async function loadBranches() {
    const branches = await ZamAPI.getBranches();
    const sel = document.getElementById('f-branch');
    branches.forEach(b => {
        const opt = document.createElement('option');
        opt.value = b.id; opt.textContent = b.name;
        sel.appendChild(opt);
    });
}

async function applyFilters() {
    const branchId = document.getElementById('f-branch').value || null;
    const { from, to } = getDateRange();

    document.getElementById('waste-tbody').innerHTML = '<tr><td colspan="5" class="p-md text-center text-on-surface-variant">جارِ التحميل...</td></tr>';
    document.getElementById('issues-tbody').innerHTML = '<tr><td colspan="5" class="p-md text-center text-on-surface-variant">جارِ التحميل...</td></tr>';

    const [waste, issues] = await Promise.all([
        ZamAPI.getWasteLogs({ branchId, dateFrom: from, dateTo: to }),
        ZamAPI.getShiftIssues({ branchId, dateFrom: from, dateTo: to }),
    ]);
    wasteData = waste;
    issuesData = issues;

    // ملخص الهدر: إجمالي عدد الأصناف المهدرة + أكثر صنف تكرارًا
    const totalItems = waste.length;
    const byItem = {};
    waste.forEach(w => { byItem[w.item_name] = (byItem[w.item_name] || 0) + Number(w.quantity || 0); });
    const topItem = Object.entries(byItem).sort((a, b) => b[1] - a[1])[0];
    const byBranchCount = new Set(waste.map(w => w.daily_reports?.branch_id)).size;

    document.getElementById('waste-summary').innerHTML = `
        <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md text-center">
            <p class="text-body-sm text-on-surface-variant">عدد سجلات الهدر</p>
            <p class="text-xl font-bold text-primary">${totalItems}</p>
        </div>
        <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md text-center">
            <p class="text-body-sm text-on-surface-variant">الأكثر هدرًا</p>
            <p class="text-xl font-bold text-error">${topItem ? topItem[0] : '—'}</p>
        </div>
        <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md text-center">
            <p class="text-body-sm text-on-surface-variant">مشاكل الشفت</p>
            <p class="text-xl font-bold text-primary">${issues.length}</p>
        </div>
        <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md text-center">
            <p class="text-body-sm text-on-surface-variant">فروع متأثرة</p>
            <p class="text-xl font-bold text-primary">${byBranchCount}</p>
        </div>
    `;

    document.getElementById('waste-tbody').innerHTML = waste.length ? waste.slice(0, 200).map(w => `
        <tr class="border-t border-outline-variant">
            <td class="p-sm">${w.daily_reports?.report_date || '—'}</td>
            <td class="p-sm">${w.daily_reports?.branches?.name || '—'}</td>
            <td class="p-sm">${w.item_name}</td>
            <td class="p-sm">${w.quantity} ${w.unit}</td>
            <td class="p-sm text-on-surface-variant">${w.reason || '—'}</td>
        </tr>`).join('') : '<tr><td colspan="5" class="p-md text-center text-on-surface-variant">لا توجد بيانات في الفترة المحددة.</td></tr>';

    const PRIORITY_COLOR = { 'عالية': 'text-error', 'متوسطة': 'text-primary', 'منخفضة': 'text-on-surface-variant' };
    document.getElementById('issues-tbody').innerHTML = issues.length ? issues.slice(0, 200).map(i => `
        <tr class="border-t border-outline-variant">
            <td class="p-sm">${i.daily_reports?.report_date || '—'}</td>
            <td class="p-sm">${i.daily_reports?.branches?.name || '—'}</td>
            <td class="p-sm">${i.issue_type || '—'}</td>
            <td class="p-sm">${i.description}</td>
            <td class="p-sm font-bold ${PRIORITY_COLOR[i.priority] || ''}">${i.priority || '—'}</td>
        </tr>`).join('') : '<tr><td colspan="5" class="p-md text-center text-on-surface-variant">لا توجد بيانات في الفترة المحددة.</td></tr>';
}

document.getElementById('apply-filters').addEventListener('click', applyFilters);

document.getElementById('export-waste').addEventListener('click', () => {
    const rows = wasteData.map(w => ({
        التاريخ: w.daily_reports?.report_date || '',
        الفرع: w.daily_reports?.branches?.name || '',
        الصنف: w.item_name,
        الكمية: w.quantity,
        الوحدة: w.unit,
        السبب: w.reason || '',
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'الهدر');
    XLSX.writeFile(wb, `تقرير_الهدر_${new Date().toISOString().split('T')[0]}.xlsx`);
});

document.getElementById('export-issues').addEventListener('click', () => {
    const rows = issuesData.map(i => ({
        التاريخ: i.daily_reports?.report_date || '',
        الفرع: i.daily_reports?.branches?.name || '',
        النوع: i.issue_type || '',
        الوصف: i.description,
        الإجراء: i.action_taken || '',
        الأولوية: i.priority || '',
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'المشاكل');
    XLSX.writeFile(wb, `تقرير_المشاكل_${new Date().toISOString().split('T')[0]}.xlsx`);
});

loadBranches().then(applyFilters);
</script>
</body></html>
