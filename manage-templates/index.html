<script>
let editingId = null;
let allTemplates = [];
let branchesCache = [];

(async function loadBranchOptions() {
    try {
        branchesCache = await ZamAPI.getBranches();
        const sel = document.getElementById('f-branch');
        branchesCache.forEach(b => {
            const opt = document.createElement('option');
            opt.value = b.id;
            opt.textContent = b.name;
            sel.appendChild(opt);
        });
    } catch (err) { console.error(err); }
})();

const modal = document.getElementById('template-modal');

// إظهار/إخفاء حقول اليوم حسب نوع التكرار
document.getElementById('f-frequency').addEventListener('change', (e) => {
    const freq = e.target.value;
    document.getElementById('f-day-row').classList.toggle('hidden', freq === 'daily' || freq === 'hourly');
    document.getElementById('f-day-of-week-wrap').classList.toggle('hidden', freq !== 'weekly');
    document.getElementById('f-day-of-month-wrap').classList.toggle('hidden', freq !== 'monthly');
});

function openModal(template = null) {
    editingId = template ? template.id : null;
    document.getElementById('modal-title').textContent = template ? 'تعديل المهمة' : 'مهمة جديدة';
    document.getElementById('f-task-title').value = template?.task_title || '';
    document.getElementById('f-category').value = template?.category || '';
    document.getElementById('f-shift').value = template?.shift_type || 'Morning';
    document.getElementById('f-instructions').value = template?.instructions || '';
    document.getElementById('f-branch').value = template?.branch_id || '';
    document.getElementById('f-requires-photo').checked = !!template?.requires_photo;
    document.getElementById('f-allows-notes').checked = template ? !!template.allows_notes : true;
    document.getElementById('f-task-type').value = template?.task_type || 'standard';
    document.getElementById('f-target-time').value = template?.target_time ? template.target_time.slice(0, 5) : '';
    const freqSel = document.getElementById('f-frequency');
    freqSel.value = template?.frequency || 'daily';
    const storedDays = Array.isArray(template?.days_of_week) && template.days_of_week.length
        ? template.days_of_week.map(Number)
        : (template && template.day_of_week !== null && template.day_of_week !== undefined ? [Number(template.day_of_week)] : []);
    const selectedDays = template ? storedDays : [new Date().getDay()];
    document.querySelectorAll('.f-weekday').forEach(box => { box.checked = selectedDays.includes(Number(box.value)); });
    document.getElementById('f-day-of-month').value = template?.day_of_month || 1;
    freqSel.dispatchEvent(new Event('change'));
    modal.classList.remove('hidden');
    modal.classList.add('flex');
}

function closeModal() {
    modal.classList.add('hidden');
    modal.classList.remove('flex');
}

document.getElementById('add-template-btn').addEventListener('click', () => openModal());
document.getElementById('cancel-modal').addEventListener('click', closeModal);

document.getElementById('save-template').addEventListener('click', async () => {
    const frequency = document.getElementById('f-frequency').value;
    const selectedWeekdays = [...document.querySelectorAll('.f-weekday:checked')].map(box => Number(box.value)).sort((a, b) => a - b);
    const payload = {
        task_title: document.getElementById('f-task-title').value.trim(),
        category: document.getElementById('f-category').value.trim(),
        shift_type: document.getElementById('f-shift').value,
        instructions: document.getElementById('f-instructions').value.trim() || null,
        branch_id: document.getElementById('f-branch').value || null,
        requires_photo: document.getElementById('f-requires-photo').checked,
        allows_notes: document.getElementById('f-allows-notes').checked,
        task_type: document.getElementById('f-task-type').value,
        target_time: document.getElementById('f-target-time').value || null,
        frequency,
        days_of_week: frequency === 'weekly' ? selectedWeekdays : [],
        day_of_week: frequency === 'weekly' ? (selectedWeekdays[0] ?? null) : null,
        day_of_month: payload_dayOfMonth(),
    };
    function payload_dayOfMonth() {
        const v = Number(document.getElementById('f-day-of-month').value);
        return frequency === 'monthly' && v >= 1 && v <= 31 ? v : null;
    }
    if (!payload.task_title || !payload.category) {
        alert('اسم المهمة والقائمة الرئيسية مطلوبين.');
        return;
    }
    if (payload.frequency === 'hourly' && payload.task_type !== 'restroom_check') {
        alert('التكرار الساعي مخصص لمهام فحص/تنظيف دورة المياه.');
        return;
    }
    if (payload.frequency === 'weekly' && !payload.days_of_week.length) {
        alert('اختر يومًا واحدًا على الأقل للتكرار الأسبوعي.');
        return;
    }
    try {
        if (editingId) {
            await ZamAPI.updateTemplate(editingId, payload);
        } else {
            await ZamAPI.createTemplate(payload);
        }
        closeModal();
        await loadTemplates();
    } catch (err) {
        console.error(err);
        alert('حدث خطأ أثناء الحفظ. تأكد إن عندك صلاحية "تعديل قوالب التشيك ليست".');
    }
});

async function deleteTemplate(id) {
    if (!confirm('أرشفة هذه النسخة؟ ستظل محفوظة مع سجلاتها، ويمكن إنشاء إصدار نشط جديد منها لاحقاً.')) return;
    try {
        await ZamAPI.deleteTemplate(id);
        await loadTemplates();
    } catch (err) {
        console.error(err);
        alert('تعذّرت الأرشفة. تأكد إن عندك الصلاحية اللازمة.');
    }
}

const SHIFT_LABELS = { Morning: 'صباحية', Evening: 'مسائية' };

async function loadTemplates() {
    const container = document.getElementById('templates-container');
    try {
        allTemplates = await ZamAPI.getTemplates(null, null, null, { includeArchived: true });
        const activeTemplates = allTemplates.filter(t => t.is_active !== false);
        const archivedTemplates = allTemplates.filter(t => t.is_active === false);
        const categories = [...new Set(allTemplates.map(t => t.category).filter(Boolean))];
        document.getElementById('category-options').innerHTML = categories.map(c => `<option value="${frEsc(c)}">`).join('');

        function renderTask(task, archived) {
            const branchName = task.branch_id ? (branchesCache.find(b => b.id === task.branch_id)?.name || 'فرع محدد') : 'كل الفروع';
            const frequencyLabel = { daily: 'يومي', weekly: 'أسبوعي', monthly: 'شهري', hourly: 'كل ساعة' }[task.frequency || 'daily'];
            const weekDays = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
            const selectedDays = Array.isArray(task.days_of_week) && task.days_of_week.length
                ? task.days_of_week.map(Number)
                : (task.day_of_week !== null && task.day_of_week !== undefined && String(task.day_of_week) !== '' ? [Number(task.day_of_week)] : []);
            const weeklyDay = task.frequency === 'weekly' && selectedDays.length
                ? ` · ${selectedDays.filter(day => day >= 0 && day <= 6).map(day => weekDays[day]).join('، ')}` : '';
            const monthlyDay = task.frequency === 'monthly' && task.day_of_month ? ` · يوم ${task.day_of_month}` : '';
            const shiftLabel = task.shift_type === 'Both' ? 'الورديتان' : (SHIFT_LABELS[task.shift_type] || task.shift_type || 'غير محددة');
            return `
                <article class="p-md flex flex-col sm:flex-row sm:items-start sm:justify-between gap-md bg-surface-container-lowest">
                    <div class="min-w-0 flex-1">
                        <div class="flex flex-wrap items-center gap-xs mb-xs">
                          <h4 class="font-bold text-on-surface text-body-lg leading-6">
                            ${frEsc(task.task_title)}
                          </h4>
                          <span class="inline-flex items-center rounded-full bg-secondary-container px-sm py-[3px] text-[11px] font-bold text-on-secondary-container">${frequencyLabel}${weeklyDay}${monthlyDay}</span>
                          ${task.requires_photo ? '<span class="inline-flex items-center gap-xs rounded-full bg-surface-container px-sm py-[3px] text-[11px] font-bold text-on-surface-variant"><span class="material-symbols-outlined text-[14px]">photo_camera</span> صورة مطلوبة</span>' : ''}
                          ${task.target_time ? `<span class="inline-flex items-center gap-xs rounded-full bg-warning-container px-sm py-[3px] text-[11px] font-bold text-on-warning">موعد ${frEsc(task.target_time.slice(0, 5))}</span>` : ''}
                        </div>
                        ${task.instructions ? `<p class="text-body-sm text-on-surface-variant mb-sm leading-6">${frEsc(task.instructions)}</p>` : ''}
                        <div class="flex flex-wrap items-center gap-x-sm gap-y-xs text-[12px]">
                          <span class="${task.branch_id ? 'text-primary font-bold' : 'text-outline'}">${task.branch_id ? '📍 ' : ''}${frEsc(branchName)}</span>
                          <span class="text-outline-variant" aria-hidden="true">•</span>
                          <span class="text-on-surface-variant">${frEsc(shiftLabel)}</span>
                        </div>
                    </div>
                    <div class="flex flex-wrap items-center gap-xs shrink-0 border-t border-outline-variant pt-sm sm:border-0 sm:pt-0">
                        ${!archived && task.task_type === 'fridge_temps' ? `<button class="fridges-btn rounded-lg px-sm py-xs text-tertiary text-[12px] font-bold hover:bg-surface-container" data-id="${frEsc(task.id)}">🧊 إدارة الثلاجات</button>` : ''}
                        ${archived ? `<button class="copy-archived-btn rounded-lg px-sm py-xs text-tertiary text-[12px] font-bold hover:bg-surface-container" data-id="${frEsc(task.id)}">إنشاء إصدار نشط</button>` : `
                          <button class="edit-btn rounded-lg px-sm py-xs text-primary text-[12px] font-bold hover:bg-primary-fixed" data-id="${frEsc(task.id)}">تعديل بإصدار جديد</button>
                          <button class="delete-btn rounded-lg px-sm py-xs text-error text-[12px] font-bold hover:bg-error-container" data-id="${frEsc(task.id)}">أرشفة</button>`}
                    </div>
                </article>`;
        }

        function renderGroups(templates, archived = false) {
            const grouped = new Map();
            templates.forEach(task => {
                if (!grouped.has(task.category)) grouped.set(task.category, { Morning: [], Evening: [], Both: [] });
                (grouped.get(task.category)[task.shift_type] || grouped.get(task.category).Both).push(task);
            });
            const frequencyRank = { daily: 0, hourly: 1, monthly: 2, weekly: 3 };
            const entries = [...grouped.entries()].sort(([a], [b]) => a.localeCompare(b, 'ar'));
            return entries.map(([category, shifts], index) => {
                const count = Object.values(shifts).reduce((sum, tasks) => sum + tasks.length, 0);
                return `
                <details class="mb-sm overflow-hidden rounded-2xl border border-outline-variant bg-surface-container-lowest shadow-sm" ${index === 0 ? 'open' : ''}>
                  <summary class="flex cursor-pointer list-none items-center justify-between gap-sm bg-surface-container-low px-md py-md hover:bg-surface-container transition-colors">
                    <span class="flex min-w-0 items-center gap-sm">
                      <span class="material-symbols-outlined text-primary" aria-hidden="true">view_list</span>
                      <span class="truncate font-bold text-on-surface text-body-lg">${frEsc(category || 'بدون فئة')}</span>
                    </span>
                    <span class="flex shrink-0 items-center gap-sm text-[12px] font-bold text-on-surface-variant"><span>${count} مهمة</span><span class="material-symbols-outlined text-primary" aria-hidden="true">expand_more</span></span>
                  </summary>
                  <div class="p-sm sm:p-md">
                    ${['Morning', 'Evening', 'Both'].map(shift => {
                        const tasks = shifts[shift].slice().sort((a, b) => (frequencyRank[a.frequency || 'daily'] ?? 4) - (frequencyRank[b.frequency || 'daily'] ?? 4) || (Number(a.sort_order) || 0) - (Number(b.sort_order) || 0));
                        return tasks.length ? `
                          <section class="mb-md last:mb-0">
                            <div class="mb-xs flex items-center justify-between gap-sm border-b border-outline-variant pb-xs">
                              <h4 class="font-bold text-primary text-body-sm">${shift === 'Both' ? 'الورديتان' : `الوردية ${SHIFT_LABELS[shift]}`}</h4>
                              <span class="text-[11px] text-on-surface-variant">${tasks.length} مهمة</span>
                            </div>
                            <div class="overflow-hidden rounded-xl border border-outline-variant divide-y divide-outline-variant">${tasks.map(task => renderTask(task, archived)).join('')}</div>
                          </section>` : '';
                    }).join('')}
                  </div>
                </details>`;
            }).join('');
        }

        const routineTemplates = activeTemplates.filter(task => task.frequency !== 'weekly');
        const weeklyTemplates = activeTemplates.filter(task => task.frequency === 'weekly');
        container.innerHTML = `
          <section class="mb-lg">
            <div class="mb-md flex items-end justify-between gap-sm border-b border-outline-variant pb-sm">
              <div><h2 class="font-title-md text-title-md text-primary">القوائم النشطة</h2><p class="mt-xs text-[12px] text-on-surface-variant">مرتبة حسب الفئة والوردية؛ افتح عنوان القائمة لعرض مهامها.</p></div>
              <span class="shrink-0 rounded-full bg-primary-container px-sm py-xs text-[12px] font-bold text-on-primary">${activeTemplates.length} مهمة</span>
            </div>
            ${routineTemplates.length ? renderGroups(routineTemplates) : (weeklyTemplates.length ? '<p class="rounded-xl border border-outline-variant bg-surface-container-lowest p-md text-body-sm text-on-surface-variant">لا توجد مهام يومية أو شهرية نشطة؛ القوالب الأسبوعية في القسم التالي.</p>' : '<p class="rounded-xl border border-outline-variant bg-surface-container-lowest p-md text-body-sm text-on-surface-variant">لا توجد قوالب نشطة حالياً.</p>')}
          </section>
          ${weeklyTemplates.length ? `<section class="mb-xl border-t-2 border-primary/20 pt-lg">
            <div class="mb-md flex items-end justify-between gap-sm border-b border-outline-variant pb-sm">
              <div><h2 class="font-title-md text-title-md text-primary">القوائم الأسبوعية</h2><p class="mt-xs text-[12px] text-on-surface-variant">موضوعة بعد القوائم اليومية لتسهيل الوصول إليها ومراجعتها.</p></div>
              <span class="shrink-0 rounded-full bg-secondary-container px-sm py-xs text-[12px] font-bold text-on-secondary-container">${weeklyTemplates.length} مهمة</span>
            </div>
            ${renderGroups(weeklyTemplates)}
          </section>` : ''}
          <details class="mt-lg overflow-hidden rounded-2xl border border-outline-variant bg-surface-container-low p-md">
            <summary class="cursor-pointer font-bold text-primary">الأرشيف المحفوظ (${archivedTemplates.length}) — لا تُحذف النسخ القديمة</summary>
            <div class="mt-md">${archivedTemplates.length ? renderGroups(archivedTemplates, true) : '<p class="text-body-sm text-on-surface-variant">لا توجد نسخ مؤرشفة.</p>'}</div>
          </details>`;

        container.querySelectorAll('.edit-btn').forEach(btn => btn.addEventListener('click', () => {
            const task = allTemplates.find(x => x.id === btn.dataset.id);
            openModal(task);
        }));
        container.querySelectorAll('.fridges-btn').forEach(btn => btn.addEventListener('click', () => {
            const task = allTemplates.find(x => x.id === btn.dataset.id);
            openFridgeModal(task?.branch_id || '');
        }));
        container.querySelectorAll('.delete-btn').forEach(btn => btn.addEventListener('click', () => deleteTemplate(btn.dataset.id)));
        container.querySelectorAll('.copy-archived-btn').forEach(btn => btn.addEventListener('click', async () => {
            if (!confirm('إنشاء قالب نشط جديد من هذه النسخة المؤرشفة؟ ستبقى النسخة الأصلية وسجلاتها محفوظة.')) return;
            try {
                await ZamAPI.copyArchivedTemplateAsNewVersion(btn.dataset.id);
                await loadTemplates();
            } catch (err) {
                console.error(err);
                alert('تعذّر إنشاء الإصدار النشط الجديد.');
            }
        }));
    } catch (err) {
        console.error(err);
        container.innerHTML = '<p class="text-error text-body-sm">تعذّر تحميل قوائم التحقق.</p>';
    }
}

// ===== إدارة الثلاجات =====
const fridgeModal = document.getElementById('fridge-modal');
let editingFridgeId = null;
let currentFridges = [];

function frEsc(v) {
    return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function applyFridgePreset() {
    const kind = document.getElementById('fr-kind').value;
    document.getElementById('fr-min').value = kind === 'freezer' ? '' : 1;
    document.getElementById('fr-max').value = kind === 'freezer' ? -18 : 4;
    document.getElementById('fr-problem').value = kind === 'freezer' ? -14 : 9;
}

function suggestFridgeNumber() {
    const kind = document.getElementById('fr-kind').value;
    const used = currentFridges.filter(f => f.kind === kind).map(f => f.number);
    document.getElementById('fr-number').value = used.length ? Math.max(...used) + 1 : 1;
}

function resetFridgeForm() {
    editingFridgeId = null;
    document.getElementById('fr-form-title').textContent = 'إضافة ثلاجة / فريزر';
    document.getElementById('fr-cancel-edit').classList.add('hidden');
    document.getElementById('fr-kind').disabled = false;
    document.getElementById('fr-name').value = '';
    applyFridgePreset();
    suggestFridgeNumber();
}

async function loadFridgeList() {
    const branchId = document.getElementById('fr-branch').value;
    const list = document.getElementById('fr-list');
    if (!branchId) { list.innerHTML = ''; return; }
    try {
        currentFridges = await ZamAPI.getFridges(branchId, { includeInactive: true });
    } catch (err) {
        console.error(err);
        list.innerHTML = '<p class="text-error text-body-sm">تعذّر تحميل الثلاجات.</p>';
        return;
    }
    list.innerHTML = currentFridges.length ? currentFridges.map(f => `
        <div class="flex items-center justify-between gap-sm py-xs border-b border-outline-variant ${f.active ? '' : 'opacity-50'}">
            <div>
                <p class="font-bold text-body-sm">${f.kind === 'freezer' ? '❄️ فريزر' : '🧊 ثلاجة'} ${f.number}${f.name ? ' — ' + frEsc(f.name) : ''}${f.active ? '' : ' (متوقفة)'}</p>
                <p class="text-[11px] text-on-surface-variant">طبيعي ${f.target_min !== null ? f.target_min + ' إلى ' : 'حتى '}${f.target_max}° • مشكلة عند ${f.problem_threshold}°</p>
            </div>
            <div class="flex gap-sm shrink-0">
                <button class="fr-edit text-primary text-[12px] font-bold" data-id="${f.id}">تعديل</button>
                <button class="fr-toggle text-secondary text-[12px] font-bold" data-id="${f.id}">${f.active ? 'إيقاف' : 'تفعيل'}</button>
                <button class="fr-del text-error text-[12px] font-bold" data-id="${f.id}">حذف</button>
            </div>
        </div>`).join('') : '<p class="text-body-sm text-on-surface-variant">لا توجد ثلاجات لهذا الفرع بعد.</p>';

    list.querySelectorAll('.fr-edit').forEach(b => b.addEventListener('click', () => {
        const f = currentFridges.find(x => x.id === b.dataset.id);
        editingFridgeId = f.id;
        document.getElementById('fr-form-title').textContent = 'تعديل ثلاجة / فريزر';
        document.getElementById('fr-cancel-edit').classList.remove('hidden');
        document.getElementById('fr-kind').value = f.kind;
        document.getElementById('fr-kind').disabled = true;
        document.getElementById('fr-number').value = f.number;
        document.getElementById('fr-name').value = f.name || '';
        document.getElementById('fr-min').value = f.target_min ?? '';
        document.getElementById('fr-max').value = f.target_max;
        document.getElementById('fr-problem').value = f.problem_threshold;
    }));
    list.querySelectorAll('.fr-toggle').forEach(b => b.addEventListener('click', async () => {
        const f = currentFridges.find(x => x.id === b.dataset.id);
        try { await ZamAPI.saveFridge({ active: !f.active }, f.id); await loadFridgeList(); }
        catch (err) { console.error(err); alert('تعذّر التحديث. تأكد من صلاحية تعديل القوالب.'); }
    }));
    list.querySelectorAll('.fr-del').forEach(b => b.addEventListener('click', async () => {
        if (!confirm('حذف الثلاجة وكل قراءاتها نهائيًا؟ (للإيقاف المؤقت استخدم «إيقاف»)')) return;
        try { await ZamAPI.deleteFridge(b.dataset.id); await loadFridgeList(); resetFridgeForm(); }
        catch (err) { console.error(err); alert('تعذّر الحذف. تأكد من صلاحية تعديل القوالب.'); }
    }));
    if (!editingFridgeId) suggestFridgeNumber();
}

function openFridgeModal(branchId) {
    const sel = document.getElementById('fr-branch');
    sel.innerHTML = branchesCache.map(b => `<option value="${b.id}">${frEsc(b.name)}</option>`).join('');
    if (branchId) sel.value = branchId;
    resetFridgeForm();
    fridgeModal.classList.remove('hidden');
    fridgeModal.classList.add('flex');
    loadFridgeList();
}

document.getElementById('open-fridges-btn').addEventListener('click', () => openFridgeModal(''));
document.getElementById('fr-branch').addEventListener('change', () => { resetFridgeForm(); loadFridgeList(); });
document.getElementById('fr-kind').addEventListener('change', () => { applyFridgePreset(); suggestFridgeNumber(); });
document.getElementById('fr-cancel-edit').addEventListener('click', () => { resetFridgeForm(); });
document.getElementById('fr-close').addEventListener('click', () => {
    fridgeModal.classList.add('hidden');
    fridgeModal.classList.remove('flex');
});
document.getElementById('fr-save').addEventListener('click', async () => {
    const branch_id = document.getElementById('fr-branch').value;
    const num = (id) => { const v = document.getElementById(id).value; return v === '' ? null : Number(v); };
    const payload = {
        branch_id,
        kind: document.getElementById('fr-kind').value,
        number: num('fr-number'),
        name: document.getElementById('fr-name').value.trim() || null,
        target_min: num('fr-min'),
        target_max: num('fr-max'),
        problem_threshold: num('fr-problem')
    };
    if (!branch_id || !payload.number || payload.target_max === null || payload.problem_threshold === null) {
        alert('الفرع والرقم وأقصى درجة وحد المشكلة مطلوبين.');
        return;
    }
    try {
        await ZamAPI.saveFridge(payload, editingFridgeId);
        resetFridgeForm();
        await loadFridgeList();
    } catch (err) {
        console.error(err);
        alert(err.code === '23505' ? 'الرقم ده مستخدم قبل كده في نفس الفرع.' : 'تعذّر الحفظ. تأكد من صلاحية تعديل القوالب.');
    }
});

loadTemplates();
</script>
</body></html>
