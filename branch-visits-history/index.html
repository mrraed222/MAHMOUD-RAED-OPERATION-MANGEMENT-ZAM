<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سجل زيارات الفروع | Operations Expert</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/supabase-config.js"></script><style>body{font-family:Tahoma,sans-serif;background:#f7f3ef;color:#24170c}.card{background:#fff;border:1px solid #e5d9cf;border-radius:18px;box-shadow:0 8px 24px #4b362110}.brand{background:linear-gradient(120deg,#24170c,#76583d);color:#fff}.muted{color:#71655c}.badge{border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}.open{background:#fff0ed;color:#8d332c}.progress{background:#fff8dc;color:#71520a}.closed{background:#e9f7ed;color:#19623a}.mail-dialog{position:fixed;inset:0;background:#24170c99;display:none;align-items:center;justify-content:center;z-index:50}.mail-dialog.open{display:flex}@media print{.no-print{display:none!important}body{background:#fff}.card{box-shadow:none}}</style></head><body><script>const currentUser=ZamSession.requireAuth('../index.html');if(!currentUser||!['Owner','Admin','Manager','Quality','Quality Manager'].includes(currentUser.role)){window.location.href=zamRoleHomePath(currentUser&&currentUser.role)}</script><header class="brand p-6"><div class="max-w-7xl mx-auto mb-3 flex items-center justify-between gap-3"><img src="../assets/logo/zam-logo.png" alt="شعار زام" class="h-20 w-auto object-contain bg-white rounded-xl p-1 shadow-sm"><a href="../dashboard/index.html" title="الصفحة الأساسية" aria-label="الصفحة الأساسية" class="no-print w-9 h-9 rounded-full bg-white/20 border border-white/40 text-white inline-flex items-center justify-center hover:bg-white/30 transition"><svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></a></div><div class="max-w-7xl mx-auto flex justify-between items-center gap-4 flex-wrap"><div><p class="opacity-75">Operations Expert</p><h1 class="text-3xl font-black">سجل زيارات الفروع</h1><p class="opacity-85 mt-1">عرض الزيارات السابقة ومتابعة الإجراءات حتى الإغلاق</p></div><div class="no-print flex gap-2"><a href="../branch-visits-new/index.html" class="bg-white text-[#33210d] rounded-full px-4 py-2 font-bold">تسجيل زيارة جديدة</a><button id="print" class="border border-white/50 rounded-full px-4 py-2">طباعة السجل</button></div></div></header><main class="max-w-7xl mx-auto p-5 md:p-8 space-y-6"><section class="card p-5 no-print"><div class="grid md:grid-cols-4 gap-3"><label>من<input id="from" type="date" class="w-full border rounded-lg p-2 mt-1"></label><label>إلى<input id="to" type="date" class="w-full border rounded-lg p-2 mt-1"></label><label>الفرع<select id="branch" class="w-full border rounded-lg p-2 mt-1"><option value="">كل الفروع</option></select></label><label>بحث<input id="search" placeholder="الزائر أو الملاحظة" class="w-full border rounded-lg p-2 mt-1"></label></div><div class="flex gap-2 mt-4"><button id="apply" class="bg-[#33210d] text-white rounded-full px-5 py-2 font-bold">تطبيق</button><button id="reload" class="border rounded-full px-5 py-2">تحديث</button></div></section><section class="grid md:grid-cols-4 gap-4"><div class="card p-4"><small class="muted">الزيارات</small><strong id="visitsCount" class="block text-3xl mt-1">—</strong></div><div class="card p-4"><small class="muted">متوسط التقييم</small><strong id="avgScore" class="block text-3xl mt-1">—</strong></div><div class="card p-4"><small class="muted">إجراءات مفتوحة</small><strong id="openCount" class="block text-3xl mt-1 text-[#8d332c]">—</strong></div><div class="card p-4"><small class="muted">مغلقة</small><strong id="closedCount" class="block text-3xl mt-1 text-[#19623a]">—</strong></div></section><section id="list" class="space-y-4"><div class="card p-6 text-center">جارٍ التحميل…</div></section></main><div id="mailDialog" class="mail-dialog no-print"><div class="card p-6 w-[min(92vw,460px)]"><h2 class="text-xl font-bold">إرسال تقرير الزيارة</h2><p class="muted text-sm mt-1">اختر المستلمين وسيتم إرسال ملف PDF كمرفق فعلي.</p><div class="space-y-3 mt-4"><label class="flex gap-2"><input type="checkbox" data-recipient="management" checked> الإدارة</label><label class="flex gap-2"><input type="checkbox" data-recipient="shift_supervisor"> مشرف الشفت</label><label class="flex gap-2"><input type="checkbox" data-recipient="self" checked> نسخة إلى بريدي</label></div><div class="flex justify-end gap-2 mt-5"><button id="cancelMail" class="border rounded-full px-4 py-2">إلغاء</button><button id="sendMail" class="bg-[#33210d] text-white rounded-full px-4 py-2 font-bold">إرسال PDF</button></div></div></div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let visits=[];const statusClass=s=>s==='مغلقة'?'closed':s==='قيد المعالجة'?'progress':'open';async function loadBranches(){const{data,error}=await zamClient.from('branches').select('id,name').order('name');if(error)throw error;branch.innerHTML='<option value="">كل الفروع</option>'+data.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}async function load(){list.innerHTML='<div class="card p-6 text-center">جارٍ التحميل…</div>';let q=zamClient.from('supervisory_visits').select('id,branch_id,visit_date,visit_type,shift_type,visitor_name,status,score_percentage,score_total,score_possible,signed_at,branches(name),supervisory_visit_notes(id,note_text,status,owner,due_date),visit_action_items(id,title,description,item_type,priority,assigned_role,due_date,status),supervisory_visit_results(id,score,result,note,is_violation,visit_checklist_templates(category,title,sort_order))').order('visit_date',{ascending:false});if(from.value)q=q.gte('visit_date',from.value);if(to.value)q=q.lte('visit_date',to.value);if(branch.value)q=q.eq('branch_id',branch.value);const{data,error}=await q.limit(1000);if(error)throw error;visits=data||[];render()}function render(){const term=search.value.trim().toLowerCase();const filtered=visits.filter(v=>!term||JSON.stringify(v).toLowerCase().includes(term));const all=filtered.flatMap(v=>v.visit_action_items||[]);visitsCount.textContent=filtered.length;const scored=filtered.filter(v=>v.score_percentage!=null);avgScore.textContent=scored.length?Math.round(scored.reduce((a,v)=>a+Number(v.score_percentage),0)/scored.length)+'%':'—';openCount.textContent=all.filter(a=>!['مغلقة','ملغاة'].includes(a.status)).length;closedCount.textContent=all.filter(a=>a.status==='مغلقة').length;list.innerHTML=filtered.length?filtered.map(v=>{const acts=v.visit_action_items||[];return `<article class="card p-5"><div class="flex justify-between gap-3 flex-wrap"><div><h2 class="text-xl font-bold">${esc(v.branches?.name||'فرع غير محدد')}</h2><p class="muted">${esc(v.visit_date)} · ${esc(v.visit_type||'زيارة دورية')} · ${v.shift_type==='Morning'?'صباحي':'مسائي'} · ${esc(v.visitor_name||'—')}</p></div><div class="text-left"><b class="text-3xl text-[#76583d]">${v.score_percentage==null?'—':Number(v.score_percentage).toFixed(0)+'%'}</b><div class="muted text-sm">${esc(v.status||'مسودة')}</div></div></div><div class="mt-4 grid md:grid-cols-3 gap-3"><div class="bg-[#f7f3ef] rounded-xl p-3"><small class="muted">الدرجة</small><b class="block">${v.score_total??'—'} / ${v.score_possible??'—'}</b></div><div class="bg-[#f7f3ef] rounded-xl p-3"><small class="muted">الإجراءات</small><b class="block">${acts.length}</b></div><div class="bg-[#f7f3ef] rounded-xl p-3"><small class="muted">التوقيع</small><b class="block">${v.signed_at?'معتمدة':'غير معتمدة'}</b></div></div>${acts.length?`<div class="mt-4"><h3 class="font-bold mb-2">الإجراءات والتكليفات</h3><div class="space-y-2">${acts.map(a=>`<div class="border rounded-xl p-3 flex justify-between gap-3 flex-wrap"><div><b>${esc(a.title)}</b><p class="muted text-sm">${esc(a.description||'')} · ${esc(a.assigned_role||'غير مسند')}</p></div><div class="flex gap-2 items-center"><span class="badge ${statusClass(a.status)}">${esc(a.status)}</span><select class="action-status border rounded-lg p-1 no-print" data-id="${a.id}"><option>مفتوحة</option><option>قيد المعالجة</option><option>بانتظار اعتماد</option><option>مغلقة</option><option>ملغاة</option></select><button class="save-action bg-[#33210d] text-white rounded-lg px-3 py-1 no-print" data-id="${a.id}">حفظ</button></div></div>`).join('')}</div></div>`:''}<div class="mt-4 text-right"><button class="border rounded-full px-4 py-2 no-print" onclick="requestVisitPdf('${v.id}',false)">تحميل PDF</button><button class="border rounded-full px-4 py-2 no-print" onclick="openMailDialog('${v.id}')">إرسال PDF بالبريد</button><button class="border rounded-full px-4 py-2 no-print" onclick="printVisit('${v.id}')">طباعة الزيارة</button></div></article>`}).join(''):'<div class="card p-8 text-center muted">لا توجد زيارات مطابقة للفلاتر.</div>'}async function updateAction(id,select){const{error}=await zamClient.from('visit_action_items').update({status:select.value,closed_at:select.value==='مغلقة'?new Date().toISOString():null,closed_by:select.value==='مغلقة'?currentUser.id:null,updated_at:new Date().toISOString()}).eq('id',id);if(error){alert(error.message);return}await load()}let mailVisitId=null;function openMailDialog(id){mailVisitId=id;mailDialog.classList.add('open')}function closeMailDialog(){mailDialog.classList.remove('open')}async function requestVisitPdf(id,send){if(send){openMailDialog(id);return}try{const{data,error}=await zamClient.functions.invoke('visit-report-pdf',{body:{visit_id:id,send_email:false,recipient_modes:[]}});if(error)throw error;if(!data?.signed_url)throw new Error(data?.error||'تعذر إنشاء PDF');window.open(data.signed_url,'_blank')}catch(e){alert('تعذر إنشاء ملف PDF: '+(e.message||e))}}async function sendVisitEmail(){const modes=[...document.querySelectorAll('[data-recipient]:checked')].map(x=>x.dataset.recipient);if(!modes.length){alert('اختر مستلماً واحداً على الأقل');return}sendMail.disabled=true;sendMail.textContent='جارٍ الإرسال…';try{const{data,error}=await zamClient.functions.invoke('visit-report-pdf',{body:{visit_id:mailVisitId,send_email:true,recipient_modes:modes}});if(error)throw error;if(data?.error)throw new Error(data.error);closeMailDialog();alert('تم إرسال PDF كمرفق إلى: '+(data.recipients||[]).join(', '))}catch(e){alert('تعذر إرسال التقرير: '+(e.message||e))}finally{sendMail.disabled=false;sendMail.textContent='إرسال PDF'}}cancelMail.onclick=closeMailDialog;sendMail.onclick=sendVisitEmail;async function printVisit(id){const v=visits.find(x=>x.id===id);if(!v)return;const w=window.open('','_blank');if(!w){alert('اسمح بفتح نافذة الطباعة ثم حاول مرة أخرى.');return}w.document.write('<p dir="rtl" style="font-family:Tahoma;padding:24px">جارٍ تحميل تقرير الزيارة ومرفقاته...</p>');w.document.close();try{const{data:evidence,error:evidenceError}=await zamClient.from('visit_evidence').select('file_path,file_name,mime_type').eq('visit_id',id).order('created_at');if(evidenceError)throw evidenceError;const attachmentRows=await Promise.all((evidence||[]).map(async item=>{const{data,error}=await zamClient.storage.from('task-evidence').createSignedUrl(item.file_path,600);return{name:item.file_name||'مرفق',url:error?null:data?.signedUrl||null}}));const results=(v.supervisory_visit_results||[]).map(r=>'<tr><td>'+esc(r.visit_checklist_templates?.category||'—')+'</td><td>'+esc(r.visit_checklist_templates?.title||'—')+'</td><td class="score">'+(r.score==null?'لا ينطبق':r.score+'/10')+'</td><td>'+esc(r.result||'—')+'</td><td>'+esc(r.note||'—')+'</td></tr>').join('');const actions=(v.visit_action_items||[]).map(a=>'<tr><td>'+esc(a.title||'—')+'</td><td>'+esc(a.priority||'—')+'</td><td>'+esc(a.assigned_role||'—')+'</td><td>'+esc(a.due_date||'—')+'</td><td>'+esc(a.status||'—')+'</td></tr>').join('');const attachments=attachmentRows.length?attachmentRows.map(a=>a.url?'<figure class="attachment"><img src="'+esc(a.url)+'" alt="'+esc(a.name)+'"><figcaption>'+esc(a.name)+'</figcaption></figure>':'<p>'+esc(a.name)+' — تعذر تحميل المرفق.</p>').join(''):'<p>لا توجد مرفقات.</p>';const printable=['<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>تقرير زيارة '+esc(v.branches?.name||'')+'</title><style>@page{size:A4;margin:14mm}*{box-sizing:border-box}body{font-family:Tahoma,Arial,sans-serif;color:#24170c;background:#f7f3ef;margin:0}.sheet{max-width:900px;margin:0 auto;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 8px 30px #24170c18}.cover{background:linear-gradient(135deg,#24170c,#76583d);color:#fff;padding:26px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px}.logo{width:105px;height:72px;object-fit:contain;background:#fff;border-radius:12px;padding:5px}.eyebrow{opacity:.78;font-size:12px}.title{font-size:25px;font-weight:800;margin:5px 0}.meta{font-size:13px;opacity:.9}.content{padding:24px 30px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{background:#f7f3ef;border:1px solid #eadfd6;border-radius:12px;padding:12px}.stat b{display:block;font-size:20px;color:#76583d}.stat span{font-size:11px;color:#71655c}.section{margin-top:22px}.section h2{font-size:16px;background:#33210d;color:#fff;border-radius:9px;padding:9px 12px;margin:0 0 10px}.section h3{font-size:13px;color:#76583d;margin:12px 0 6px}table{width:100%;border-collapse:collapse;font-size:11px}th{background:#f0e8e1;color:#33210d}th,td{border:1px solid #dfd3c9;padding:8px;text-align:right;vertical-align:top}.score{font-weight:800;color:#76583d;white-space:nowrap}.attachments{display:grid;grid-template-columns:1fr;gap:12px}.attachment{break-inside:avoid;page-break-inside:avoid;border:1px solid #dfd3c9;border-radius:10px;padding:10px;margin:0}.attachment img{display:block;max-width:100%;max-height:240mm;object-fit:contain;margin:0 auto}.attachment figcaption{font-size:10px;color:#71655c;margin-top:6px}.footer{border-top:1px solid #eadfd6;padding:14px 30px;color:#71655c;font-size:10px}@media print{body{background:#fff}.sheet{box-shadow:none;border-radius:0}.no-print{display:none!important}}</style></head><body><div class="sheet"><header class="cover"><div><div class="eyebrow">Operations Expert · تقرير رقابة تشغيلية</div><div class="title">تقرير زيارة فرع</div><div class="meta">'+esc(v.branches?.name||'فرع غير محدد')+' · '+esc(v.visit_date||'—')+' · '+(v.shift_type==='Morning'?'صباحي':'مسائي')+'</div></div><img class="logo" src="../assets/logo/zam-logo.png" alt="شعار Operations Expert"></header><main class="content"><div class="grid"><div class="stat"><b>'+((v.score_percentage==null?'—':Number(v.score_percentage).toFixed(0)+'%'))+'</b><span>النتيجة العامة</span></div><div class="stat"><b>'+esc(v.score_total??'—')+' / '+esc(v.score_possible??'—')+'</b><span>الدرجة</span></div><div class="stat"><b>'+esc(v.visitor_name||'—')+'</b><span>الزائر</span></div><div class="stat"><b>'+esc(v.status||'—')+'</b><span>الحالة</span></div></div><section class="section"><h2>بنود التقييم ودرجاتها</h2><table><thead><tr><th>المحور</th><th>البند</th><th>الدرجة</th><th>النتيجة</th><th>الملاحظة</th></tr></thead><tbody>'+results+'</tbody></table></section><section class="section"><h2>الإجراءات والمخالفات</h2><table><thead><tr><th>الإجراء</th><th>الأولوية</th><th>المسؤول</th><th>الموعد</th><th>الحالة</th></tr></thead><tbody>'+(actions||'<tr><td colspan="5">لا توجد إجراءات مسجلة</td></tr>')+'</tbody></table></section><section class="section"><h2>المرفقات</h2><div class="attachments">'+attachments+'</div></section><section class="section"><h2>الملاحظات العامة</h2><p>'+esc(v.observation||'لا توجد ملاحظات عامة')+'</p></section></main><footer class="footer">اعتماد إلكتروني: '+(v.signed_at?'معتمدة':'غير معتمدة')+' · Operations Expert · يتم إنشاء هذا التقرير من سجل الزيارات.</footer></div><script>window.onload=function(){window.focus();window.print()}<\/script></body></html>'].join('');w.document.open();w.document.write(printable);w.document.close()}catch(error){w.document.open();w.document.write('<p dir="rtl" style="font-family:Tahoma;padding:24px;color:#8d332c">تعذر تجهيز التقرير: '+esc(error.message||error)+'</p>');w.document.close()}}apply.onclick=load;reload.onclick=load;search.oninput=render;print.onclick=()=>window.print();list.addEventListener('click',e=>{const b=e.target.closest('.save-action');if(b)updateAction(b.dataset.id,b.parentElement.querySelector('.action-status'))});Promise.all([loadBranches(),load()]).catch(e=>list.innerHTML=`<div class="card p-6 text-red-700">تعذر التحميل: ${esc(e.message)}</div>`)</script></body></html>
