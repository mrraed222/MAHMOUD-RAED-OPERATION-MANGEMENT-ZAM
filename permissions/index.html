<script>
const ROLES = ['Owner', 'Admin', 'Supervisor', 'Barista', 'Kitchen', 'Waiter'];
const ROLE_LABELS = { Owner: 'مالك', Admin: 'أدمن', Supervisor: 'مشرف وردية', Barista: 'باريستا', Kitchen: 'مطبخ', Waiter: 'خدمة' };
const PERMS = [
    { key: 'can_manage_staff', label: 'إدارة الموظفين' },
    { key: 'can_manage_branches', label: 'إدارة الفروع' },
    { key: 'can_manage_templates', label: 'تعديل قوالب التشيك ليست' },
    { key: 'can_manage_automations', label: 'إعدادات الأتمتة' },
    { key: 'can_manage_reports', label: 'تعديل/حذف التقارير' },
    { key: 'can_view_all_reports', label: 'الاطلاع على كل التقارير' },
];

document.getElementById('my-email').value = currentUser.email || '';

document.getElementById('save-my-account').addEventListener('click', async () => {
    const email = document.getElementById('my-email').value.trim();
    const newPasscode = document.getElementById('my-passcode').value.trim();
    const msg = document.getElementById('my-account-msg');
    msg.classList.add('hidden');

    const payload = { email };
    if (newPasscode) {
        if (newPasscode.length < 4) {
            msg.textContent = 'رمز المرور لازم يكون 4 أحرف/أرقام على الأقل.';
            msg.className = 'text-error text-body-sm mt-sm';
            return;
        }
        payload.passcode = newPasscode;
    }

    try {
        await zamClient.from('profiles').update(payload).eq('id', currentUser.id);
        currentUser.email = email;
        if (newPasscode) currentUser.passcode = newPasscode;
        ZamSession.save(currentUser);
        document.getElementById('my-passcode').value = '';
        msg.textContent = 'تم الحفظ بنجاح.';
        msg.className = 'text-tertiary-container text-body-sm mt-sm font-bold';
    } catch (err) {
        console.error(err);
        msg.textContent = err.message?.includes('duplicate') ? 'رمز المرور ده مستخدم بالفعل.' : 'حدث خطأ أثناء الحفظ.';
        msg.className = 'text-error text-body-sm mt-sm';
    }
});

let branchesCache = [];
let permsCache = {}; // profile_id -> permissions row

function permsCellHTML(emp) {
    if (emp.role === 'Owner') return '<span class="text-outline text-[11px]">—</span>';
    const p = permsCache[emp.id] || {};
    return `<button class="edit-perms-btn text-primary hover:underline text-[12px] font-bold" data-id="${emp.id}">تحديد الصلاحيات</button>`;
}

async function openPermsEditor(empId, empName) {
    const p = permsCache[empId] || {};
    const existing = document.getElementById('perms-modal');
    if (existing) existing.remove();

    // جلب الفئات المسندة من جدول employee_task_categories (يدعم تعدد الفئات)
    let activeCategories = [];
    try {
        activeCategories = await ZamAPI.getTaskCategories(empId);
    } catch (e) {
        console.error('Error fetching profile categories:', e);
    }

    // Fetch templates to extract unique categories dynamically
    let dbCategories = [];
    try {
        const { data: templates } = await zamClient.from('checklist_templates').select('category');
        dbCategories = [...new Set((templates || []).map(t => t.category).filter(Boolean))];
    } catch (e) {
        console.error('Error fetching template categories:', e);
    }
    const defaultCategories = ['البار', 'الصالة', 'المطبخ', 'مهام المشرفين'];
    const allCategories = [...new Set([...defaultCategories, ...dbCategories])];

    const modal = document.createElement('div');
    modal.id = 'perms-modal';
    modal.className = 'fixed inset-0 bg-inverse-surface/40 flex items-center justify-center z-50 p-margin-mobile';
    modal.innerHTML = `
        <div class="bg-surface-container-lowest rounded-xl p-md w-full max-w-sm max-h-[90vh] overflow-y-auto">
            <h3 class="font-title-md text-title-md text-primary mb-xs">صلاحيات ${empName}</h3>
            <p class="text-body-sm text-on-surface-variant mb-sm">حدد الأقسام/المهام والصلاحيات الإدارية الخاصة بالموظف.</p>

            <div class="mb-md">
                <h4 class="font-bold text-sm text-primary mb-xs border-b border-outline-variant pb-xs">📋 قوائم المهام المسندة (التحكم المتعدد)</h4>
                <div class="flex flex-col gap-xs max-h-[150px] overflow-y-auto">
                    ${allCategories.map(cat => {
                        const checked = activeCategories.includes(cat);
                        return `
                            <label class="flex items-center gap-sm cursor-pointer hover:bg-surface-container p-1 rounded transition-colors">
                                <input type="checkbox" class="category-checkbox w-5 h-5 text-primary" data-category="${cat}" ${checked ? 'checked' : ''}/>
                                <span class="text-body-sm text-on-surface">${cat}</span>
                            </label>
                        `;
                    }).join('')}
                </div>
            </div>

            <div class="mb-md">
                <h4 class="font-bold text-sm text-primary mb-xs border-b border-outline-variant pb-xs">🔐 الصلاحيات الإدارية (أدمن/مشرف)</h4>
                <div class="flex flex-col gap-sm">
                    ${PERMS.map(perm => `
                        <label class="flex items-center gap-sm cursor-pointer hover:bg-surface-container p-1 rounded transition-colors">
                            <input type="checkbox" class="perm-checkbox w-5 h-5 text-primary" data-key="${perm.key}" ${p[perm.key] ? 'checked' : ''}/>
                            <span class="text-body-sm text-on-surface">${perm.label}</span>
                        </label>
                    `).join('')}
                </div>
            </div>

            <div class="flex gap-sm justify-end border-t border-outline-variant pt-sm">
                <button id="cancel-perms" class="px-md py-xs rounded-lg text-on-surface-variant hover:bg-surface-container">إلغاء</button>
                <button id="save-perms" class="px-md py-xs bg-primary text-on-primary rounded-lg font-bold hover:bg-primary-hover">حفظ التغييرات</button>
            </div>
        </div>`;
    document.body.appendChild(modal);

    document.getElementById('cancel-perms').addEventListener('click', () => modal.remove());
    document.getElementById('save-perms').addEventListener('click', async () => {
        // Collect selected admin permissions
        const payload = { profile_id: empId };
        modal.querySelectorAll('.perm-checkbox').forEach(cb => { payload[cb.dataset.key] = cb.checked; });

        // Collect selected categories
        const selectedCats = [];
        modal.querySelectorAll('.category-checkbox').forEach(cb => {
            if (cb.checked) selectedCats.push(cb.dataset.category);
        });

        try {
            // Save admin permissions
            await zamClient.from('admin_permissions').upsert(payload);
            permsCache[empId] = payload;

            // حفظ الفئات المتعددة في جدول employee_task_categories المخصص
            await ZamAPI.replaceTaskCategories(empId, selectedCats);

            modal.remove();

            // Reload list to reflect changes
            await loadStaff();
        } catch (err) {
            console.error(err);
            alert('حدث خطأ أثناء حفظ الصلاحيات والمهام.');
        }
    });
}

function renderPending(pending) {
    const section = document.getElementById('pending-section');
    const list = document.getElementById('pending-list');
    if (!pending.length) { section.classList.add('hidden'); return; }
    section.classList.remove('hidden');

    list.innerHTML = pending.map(emp => `
        <div class="bg-error-container/20 border border-error/40 rounded-xl p-md" data-id="${emp.id}">
            <div class="flex items-center gap-md mb-sm">
                ${emp.avatar_url ? `<img src="${emp.avatar_url}" class="w-12 h-12 rounded-full object-cover"/>` : '<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center"><span class="material-symbols-outlined">person</span></div>'}
                <div>
                    <p class="font-bold text-on-surface">${emp.full_name} <span class="text-[11px] text-on-surface-variant">(${emp.employee_number || '—'})</span></p>
                    <p class="text-body-sm text-on-surface-variant">${emp.email || '—'} ${emp.whatsapp_number ? '• ' + emp.whatsapp_number : ''}</p>
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-5 gap-sm items-end">
                <div>
                    <label class="text-[11px] text-on-surface-variant">الدور</label>
                    <select class="p-role-select w-full border border-outline-variant rounded-lg p-1">
                        ${ROLES.filter(r => r !== 'Owner').map(r => `<option value="${r}" ${r === emp.role ? 'selected' : ''}>${ROLE_LABELS[r]}</option>`).join('')}
                    </select>
                </div>
                <div>
                    <label class="text-[11px] text-on-surface-variant">الفرع</label>
                    <select class="p-branch-select w-full border border-outline-variant rounded-lg p-1">
                        <option value="">بدون فرع</option>
                        ${branchesCache.map(b => `<option value="${b.id}" ${b.id === emp.branch_id ? 'selected' : ''}>${b.name}</option>`).join('')}
                    </select>
                </div>
                <div>
                    <label class="text-[11px] text-on-surface-variant">الوردية</label>
                    <select class="p-shift-select w-full border border-outline-variant rounded-lg p-1">
                        <option value="Morning" ${emp.shift_type === 'Morning' ? 'selected' : ''}>صباحي</option>
                        <option value="Evening" ${emp.shift_type === 'Evening' ? 'selected' : ''}>مسائي</option>
                        <option value="Both" ${emp.shift_type === 'Both' ? 'selected' : ''}>كلاهما</option>
                    </select>
                </div>
                <label class="flex items-center gap-1 text-body-sm font-bold">
                    <input type="checkbox" class="p-reports-check w-4 h-4"/> يستلم ملخص/تقرير فرعه
                </label>
                <div class="flex gap-sm">
                    <button class="approve-btn flex-1 bg-tertiary-container text-on-tertiary rounded-lg py-1 text-body-sm font-bold">قبول</button>
                    <button class="reject-btn flex-1 bg-error text-on-error rounded-lg py-1 text-body-sm font-bold">رفض</button>
                </div>
            </div>
        </div>
    `).join('');

    list.querySelectorAll('.approve-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
            const card = btn.closest('[data-id]');
            const id = card.dataset.id;
            const role = card.querySelector('.p-role-select').value;
            const branch_id = card.querySelector('.p-branch-select').value || null;
            const shift_type = card.querySelector('.p-shift-select').value;
            const receives_branch_reports = card.querySelector('.p-reports-check').checked;
            btn.disabled = true;
            try {
                await zamClient.from('profiles').update({ status: 'active', role, branch_id, shift_type, receives_branch_reports }).eq('id', id);
                await loadStaff();
            } catch (err) {
                console.error(err);
                alert('حدث خطأ أثناء الموافقة.');
                btn.disabled = false;
            }
        });
    });

    list.querySelectorAll('.reject-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
            if (!confirm('تأكيد رفض هذا الطلب؟')) return;
            const card = btn.closest('[data-id]');
            const id = card.dataset.id;
            try {
                await zamClient.from('profiles').update({ status: 'rejected' }).eq('id', id);
                await loadStaff();
            } catch (err) {
                console.error(err);
                alert('حدث خطأ أثناء الرفض.');
            }
        });
    });
}

async function loadStaff() {
    const tbody = document.getElementById('staff-tbody');
    try {
        const [branches, staff, permsRes] = await Promise.all([
            ZamAPI.getBranches(),
            ZamAPI.getStaff(),
            zamClient.from('admin_permissions').select('*')
        ]);
        branchesCache = branches;
        (permsRes.data || []).forEach(row => { permsCache[row.profile_id] = row; });

        const pending = staff.filter(e => e.status === 'pending');
        const others = staff.filter(e => e.status !== 'pending');

        renderPending(pending);

        tbody.innerHTML = others.map(emp => `
            <tr class="border-t border-outline-variant" data-id="${emp.id}" data-name="${emp.full_name}">
                <td class="p-sm font-bold">${emp.full_name}${emp.id === currentUser.id ? ' <span class=\"text-[10px] text-primary\">(أنت)</span>' : ''}${emp.status === 'rejected' ? ' <span class=\"text-[10px] text-error font-bold\">(مرفوض)</span>' : ''}</td>
                <td class="p-sm">
                    <select class="role-select border border-outline-variant rounded-lg p-1" ${emp.id === currentUser.id ? 'disabled' : ''}>
                        ${ROLES.map(r => `<option value="${r}" ${r === emp.role ? 'selected' : ''}>${ROLE_LABELS[r]}</option>`).join('')}
                    </select>
                </td>
                <td class="p-sm">
                    <select class="branch-select border border-outline-variant rounded-lg p-1">
                        <option value="">بدون فرع</option>
                        ${branchesCache.map(b => `<option value="${b.id}" ${b.id === emp.branch_id ? 'selected' : ''}>${b.name}</option>`).join('')}
                    </select>
                </td>
                <td class="p-sm">
                    <select class="shift-select border border-outline-variant rounded-lg p-1">
                        <option value="Morning" ${emp.shift_type === 'Morning' ? 'selected' : ''}>صباحي</option>
                        <option value="Evening" ${emp.shift_type === 'Evening' ? 'selected' : ''}>مسائي</option>
                        <option value="Both" ${emp.shift_type === 'Both' ? 'selected' : ''}>كلاهما</option>
                    </select>
                </td>
                <td class="p-sm">
                    <input type="text" class="passcode-input border border-outline-variant rounded-lg p-1 w-24" value="${emp.passcode}"/>
                </td>
                <td class="p-sm perms-cell">${permsCellHTML(emp)}</td>
                <td class="p-sm">
                    <button class="save-row-btn text-primary hover:underline text-[12px] font-bold">حفظ</button>
                    <span class="row-msg text-[11px]"></span>
                </td>
            </tr>
        `).join('');

        tbody.querySelectorAll('.edit-perms-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const row = btn.closest('tr');
                openPermsEditor(row.dataset.id, row.dataset.name);
            });
        });

        tbody.querySelectorAll('.role-select').forEach(sel => {
            sel.addEventListener('change', () => {
                const row = sel.closest('tr');
                row.querySelector('.perms-cell').innerHTML = permsCellHTML({ id: row.dataset.id, role: sel.value });
                if (sel.value !== 'Owner') {
                    row.querySelector('.edit-perms-btn')?.addEventListener('click', () => openPermsEditor(row.dataset.id, row.dataset.name));
                }
            });
        });

        tbody.querySelectorAll('.save-row-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                const row = btn.closest('tr');
                const id = row.dataset.id;
                const role = row.querySelector('.role-select').value;
                const branch_id = row.querySelector('.branch-select').value || null;
                const shift_type = row.querySelector('.shift-select').value;
                const passcode = row.querySelector('.passcode-input').value.trim();
                const msgEl = row.querySelector('.row-msg');

                try {
                    await zamClient.from('profiles').update({ role, branch_id, shift_type, passcode }).eq('id', id);
                    msgEl.textContent = 'تم ✓';
                    msgEl.className = 'row-msg text-[11px] text-tertiary-container font-bold';
                } catch (err) {
                    console.error(err);
                    msgEl.textContent = err.message?.includes('duplicate') ? 'الرمز مستخدم' : 'خطأ';
                    msgEl.className = 'row-msg text-[11px] text-error font-bold';
                }
            });
        });
    } catch (err) {
        console.error(err);
        tbody.innerHTML = '<tr><td colspan="6" class="p-md text-center text-error">تعذّر تحميل بيانات الموظفين.</td></tr>';
    }
}

loadStaff();
</script>
</body></html>
