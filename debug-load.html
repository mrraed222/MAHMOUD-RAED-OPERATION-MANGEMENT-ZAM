<!DOCTYPE html>
<html dir="rtl" lang="ar"><head>
<meta charset="utf-8">
<title>تشخيص تحميل المهام</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js?v=debug2"></script>
</head>
<body class="p-8" style="background:#fff;color:#111">
<h2>Load Diagnostics</h2>
<pre id="out">running...</pre>
<script>
(async () => {
  const lines = [];
  const log = (m) => lines.push(m);
  try {
    await zamClient.auth.getSession();
    log('step1 session ok');
    const profile = ZamSession.get();
    log('profile from sessionStorage: ' + JSON.stringify(profile && { id: profile.id, role: profile.role, shift: profile.shift_type, branch: profile.branch_id }));
    log('has ZamAPI.isTaskDueToday: ' + typeof ZamAPI.isTaskDueToday);
    log('has ZamAPI.getTaskCategories: ' + typeof ZamAPI.getTaskCategories);
    let currentShift = profile.shift_type && profile.shift_type !== 'Both' ? profile.shift_type : 'Morning';
    try {
      const t = await ZamAPI.getTemplates(null, currentShift, profile.branch_id);
      log('getTemplates ok: ' + t.length + ' templates');
      const filtered = t.filter(x => ZamAPI.isTaskDueToday(x));
      log('after isTaskDueToday: ' + filtered.length);
      try {
        const cats = await ZamAPI.getTaskCategories(profile.id);
        log('getTaskCategories: ' + JSON.stringify(cats));
      } catch (e2) { log('getTaskCategories FAILED: ' + String(e2)); }
      const myCats = (await ZamAPI.getTaskCategories(profile.id).catch(() => []));
      const finalList = filtered.filter(x => myCats.includes(x.category));
      log('final tasks for employee: ' + finalList.length);
      log('by category: ' + JSON.stringify(finalList.reduce((a, x) => { a[x.category] = (a[x.category] || 0) + 1; return a; }, {})));
    } catch (e1) { log('TEMPLATES STEP FAILED: ' + String(e1)); }
    try {
      const logs = await ZamAPI.getTodayLogs(profile.branch_id);
      log('getTodayLogs ok: ' + logs.length);
    } catch (e3) { log('getTodayLogs FAILED: ' + String(e3)); }
  } catch (e) {
    log('EXCEPTION: ' + String(e));
  }
  document.getElementById('out').textContent = lines.join('\n');
})();
</script>
</body></html>
