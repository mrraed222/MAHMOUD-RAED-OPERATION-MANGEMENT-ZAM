    }catch(_e){}</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/supabase-config.js"></script>
<script>
  const currentUser = ZamSession.requireAuth('../index.html');
  if (!['Owner','Admin'].includes(currentUser.role)) {
      window.location.href = zamRoleHomePath(currentUser.role);
  }
</script>
</head>
<body class="bg-background text-on-surface overflow-x-hidden">
<script>document.write(renderZamSidebar('manage-templates', currentUser.role));</script>

<header class="fixed top-0 left-0 w-full md:pr-[280px] h-20 bg-surface-container-lowest border-b border-outline-variant shadow-sm z-40 flex justify-between items-center px-margin-desktop">
  <div class="flex items-center gap-md">
    <a href="../dashboard/index.html" class="text-on-surface-variant hover:text-primary"><span class="material-symbols-outlined">arrow_forward</span></a>
    <div>
      <h1 class="font-title-md text-title-md text-primary">إدارة قوائم التحقق</h1>
      <p class="text-body-sm text-on-surface-variant">أضف، عدّل، أو احذف مهام التشيك ليست وقوائمه الرئيسية</p>
    </div>
  </div>
  <button id="add-template-btn" class="bg-primary text-on-primary rounded-lg px-md py-sm font-bold flex items-center gap-1">
    <span class="material-symbols-outlined text-base">add</span> مهمة جديدة
  </button>
</header>

<main class="md:pr-[280px] pt-20 min-h-screen"><div class="max-w-4xl mx-auto p-margin-desktop">
  <div id="perm-warning" class="hidden bg-error-container text-on-error-container p-md rounded-xl mb-md text-body-sm"></div>
  <div id="templates-container">
    <p class="text-on-surface-variant text-body-sm">جارِ التحميل...</p>
  </div>
</div></main>

<!-- Modal إضافة/تعديل -->
<div id="template-modal" class="fixed inset-0 bg-inverse-surface/40 hidden items-center justify-center z-50 p-margin-mobile">
  <div class="bg-surface-container-lowest rounded-xl p-md w-full max-w-md max-h-[90vh] overflow-y-auto">
    <h3 class="font-title-md text-title-md text-primary mb-md" id="modal-title">مهمة جديدة</h3>
    <div class="flex flex-col gap-sm">
      <div>
        <label class="text-body-sm text-on-surface-variant">اسم المهمة</label>
        <input id="f-task-title" class="w-full border border-outline-variant rounded-lg p-sm mt-xs" placeholder="مثال: مراجعة نظافة منطقة التحضير"/>
      </div>
      <div class="grid grid-cols-2 gap-sm">
        <div>
          <label class="text-body-sm text-on-surface-variant">القائمة الرئيسية (الفئة)</label>
          <input id="f-category" list="category-options" class="w-full border border-outline-variant rounded-lg p-sm mt-xs" placeholder="البار / المطبخ / الصالة..."/>
          <datalist id="category-options"></datalist>
        </div>
        <div>
          <label class="text-body-sm text-on-surface-variant">الوردية</label>
          <select id="f-shift" class="w-full border border-outline-variant rounded-lg p-sm mt-xs">
            <option value="Morning">صباحية</option>
            <option value="Evening">مسائية</option>
          </select>
        </div>
      </div>
      <div>
        <label class="text-body-sm text-on-surface-variant">تطبّق على</label>
        <select id="f-branch" class="w-full border border-outline-variant rounded-lg p-sm mt-xs">
          <option value="">كل الفروع</option>
        </select>
      </div>
      <div>
        <label class="text-body-sm text-on-surface-variant">تعليمات وملاحظات إضافية (تظهر للموظف عند التنفيذ)</label>
        <textarea id="f-instructions" rows="3" class="w-full border border-outline-variant rounded-lg p-sm mt-xs" placeholder="اختياري..."></textarea>
      </div>
      <label class="flex items-center gap-sm mt-xs">
        <input type="checkbox" id="f-requires-photo" class="w-5 h-5"/>
        <span class="text-body-sm">تتطلب صورة إثبات عند التنفيذ</span>
      </label>
    </div>
    <div class="flex gap-sm justify-end mt-md">
      <button id="cancel-modal" class="px-md py-sm rounded-lg text-on-surface-variant">إلغاء</button>
      <button id="save-template" class="px-md py-sm bg-primary text-on-primary rounded-lg font-bold">حفظ</button>
    </div>
  </div>
</div>

<script>
let editingId = null;
let allTemplates = [];
let branchesCache = [];

(async function loadBranchOptions() {
    try {
        branchesCache = await ZamAPI.getBranches();
        const sel = document.getElementById('f-branch');
        branchesCache.forEach(b => {
            const opt = document.createElement('option');
            opt.value = b.id;
            opt.textContent = b.name;
            sel.appendChild(opt);
        });
    } catch (err) { console.error(err); }
})();

const modal = document.getElementById('template-modal');

function openModal(template = null) {
    editingId = template ? template.id : null;
    document.getElementById('modal-title').textContent = template ? 'تعديل المهمة' : 'مهمة جديدة';
    document.getElementById('f-task-title').value = template?.task_title || '';
    document.getElementById('f-category').value = template?.category || '';
    document.getElementById('f-shift').value = template?.shift_type || 'Morning';
    document.getElementById('f-instructions').value = template?.instructions || '';
    document.getElementById('f-branch').value = template?.branch_id || '';
    document.getElementById('f-requires-photo').checked = !!template?.requires_photo;
    modal.classList.remove('hidden');
    modal.classList.add('flex');
}

function closeModal() {
    modal.classList.add('hidden');
    modal.classList.remove('flex');
}

document.getElementById('add-template-btn').addEventListener('click', () => openModal());
document.getElementById('cancel-modal').addEventListener('click', closeModal);

document.getElementById('save-template').addEventListener('click', async () => {
    const payload = {
        task_title: document.getElementById('f-task-title').value.trim(),
        category: document.getElementById('f-category').value.trim(),
        shift_type: document.getElementById('f-shift').value,
        instructions: document.getElementById('f-instructions').value.trim() || null,
        branch_id: document.getElementById('f-branch').value || null,
        requires_photo: document.getElementById('f-requires-photo').checked,
    };
    if (!payload.task_title || !payload.category) {
        alert('اسم المهمة والقائمة الرئيسية مطلوبين.');
        return;
    }
    try {
        if (editingId) {
            await ZamAPI.updateTemplate(editingId, payload);
        } else {
            await ZamAPI.createTemplate(payload);
        }
        closeModal();
        await loadTemplates();
    } catch (err) {
        console.error(err);
        alert('حدث خطأ أثناء الحفظ. تأكد إن عندك صلاحية "تعديل قوالب التشيك ليست".');
    }
});

async function deleteTemplate(id) {
    if (!confirm('تأكيد حذف هذه المهمة نهائياً؟')) return;
    try {
        await ZamAPI.deleteTemplate(id);
        await loadTemplates();
    } catch (err) {
        console.error(err);
        alert('تعذّر الحذف. تأكد إن عندك الصلاحية اللازمة.');
    }
}

const SHIFT_LABELS = { Morning: 'صباحية', Evening: 'مسائية' };

async function loadTemplates() {
    const container = document.getElementById('templates-container');
    try {
        allTemplates = await ZamAPI.getTemplates();

        // تحديث قائمة الفئات المقترحة
        const categories = [...new Set(allTemplates.map(t => t.category))];
        document.getElementById('category-options').innerHTML = categories.map(c => `<option value="${c}">`).join('');

        if (!allTemplates.length) {
            container.innerHTML = '<p class="text-on-surface-variant text-body-sm">لا توجد مهام بعد. ابدأ بإضافة أول مهمة.</p>';
            return;
        }

        // تجميع حسب الفئة ثم الوردية
        const grouped = {};
        allTemplates.forEach(t => {
            grouped[t.category] = grouped[t.category] || { Morning: [], Evening: [] };
            grouped[t.category][t.shift_type]?.push(t);
        });

        container.innerHTML = Object.entries(grouped).map(([cat, shifts]) => `
            <div class="mb-lg">
                <h2 class="font-title-md text-title-md text-primary mb-sm">${cat}</h2>
                ${['Morning', 'Evening'].map(shift => shifts[shift].length ? `
                    <div class="mb-sm">
                        <p class="text-body-sm font-bold text-on-surface-variant mb-xs">الوردية ${SHIFT_LABELS[shift]}</p>
                        <div class="bg-surface-container-lowest rounded-xl border border-outline-variant divide-y divide-outline-variant">
                            ${shifts[shift].map(t => `
                                <div class="p-sm flex items-center justify-between gap-sm">
                                    <div>
                                        <p class="font-bold text-on-surface text-body-sm">${t.task_title} ${t.requires_photo ? '<span class="material-symbols-outlined text-[14px] align-middle text-outline">photo_camera</span>' : ''}</p>
                                        ${t.instructions ? `<p class="text-[12px] text-on-surface-variant">${t.instructions}</p>` : ''}
                                        <span class="text-[11px] ${t.branch_id ? 'text-primary font-bold' : 'text-outline'}">${t.branch_id ? '📍 ' + (branchesCache.find(b => b.id === t.branch_id)?.name || 'عام (كل الفروع)') : 'عام (كل الفروع)'}</span>
                                    </div>
                                    <div class="flex gap-sm shrink-0">
                                        <button class="edit-btn text-primary text-[12px] font-bold hover:underline" data-id="${t.id}">تعديل</button>
                                        <button class="delete-btn text-error text-[12px] font-bold hover:underline" data-id="${t.id}">حذف</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                ` : '').join('')}
            </div>
        `).join('');

        container.querySelectorAll('.edit-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const t = allTemplates.find(x => x.id === btn.dataset.id);
                openModal(t);
            });
        });
        container.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', () => deleteTemplate(btn.dataset.id));
        });
    } catch (err) {
        console.error(err);
        container.innerHTML = '<p class="text-error text-body-sm">تعذّر تحميل قوائم التحقق.</p>';
    }
}

loadTemplates();
</script>
</body></html>
