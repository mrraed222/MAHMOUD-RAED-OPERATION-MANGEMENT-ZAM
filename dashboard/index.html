<script>
document.getElementById('date-label').textContent = new Date().toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

let dashboardRows = [];
let dashboardLoadGeneration = 0;
const stateEl = document.getElementById('dashboard-state');
const cardsEl = document.getElementById('branch-cards');

function renderBranchCards() {
    const rows = dashboardRows.slice();
    rows.sort((a, b) => (a.pct ?? -1) - (b.pct ?? -1));
    cardsEl.innerHTML = rows.map(row => row.html).join('');
    document.getElementById('branch-result-count').textContent = `عرض ${rows.length} من ${dashboardRows.length} فرعًا · الإنجاز والمبيعات بحسب السجلات المتاحة`;
    if (!rows.length) cardsEl.innerHTML = `<p class="text-on-surface-variant text-body-sm bg-surface-container-lowest border border-outline-variant rounded-xl p-md" role="status">لا توجد فروع عاملة لعرضها وفق البيانات الحالية.</p>`;
}

async function loadDashboard() {
    const generation = ++dashboardLoadGeneration;
    cardsEl.setAttribute('aria-busy', 'true');
    stateEl.textContent = 'جارٍ تحديث بيانات الفروع والمؤشرات…';
    const now = new Date();
    const today = ZamChecklistSchedule.riyadhDateString(now);
    const yesterday = ZamChecklistSchedule.riyadhDateString(new Date(now.getTime() - 24 * 60 * 60 * 1000));

    try {
    const [allBranches, templates, restroomConfig, todayLogsRes, todayReportsRes, openIssuesRes] = await Promise.all([
        ZamAPI.getBranches(),
        ZamAPI.getTemplates(),
        ZamAPI.getRestroomHourlyTaskConfig().catch(error => {
            console.warn('Restroom hourly task configuration is unavailable:', error);
            return null;
        }),
        zamClient.from('checklist_logs').select('branch_id, template_id, executed_by, shift_type, execution_date, status, photo_url, created_at').gte('execution_date', yesterday).lte('execution_date', today),
        zamClient.from('daily_reports').select('branch_id, total_sales').eq('report_date', today),
        zamClient.from('shift_issues').select('id, branch_id').gte('created_at', today)
    ]);

    if (generation !== dashboardLoadGeneration) return;
    const branches = allBranches.filter(branch => ZamBranchLifecycle.isOperational(branch, now));
    const operationalBranchIds = new Set(branches.map(branch => branch.id));
    const branchById = new Map(allBranches.map(branch => [String(branch.id), branch]));

    const todayLogs = (todayLogsRes.data || []).filter(row => operationalBranchIds.has(row.branch_id) &&
        ZamBranchLifecycle.isOperational(branchById.get(String(row.branch_id)), row.execution_date || now));
    const todayReports = (todayReportsRes.data || []).filter(row => operationalBranchIds.has(row.branch_id) &&
        ZamBranchLifecycle.isOperational(branchById.get(String(row.branch_id)), row.report_date || now));
    const openIssues = (openIssuesRes.data || []).filter(row => operationalBranchIds.has(row.branch_id) &&
        ZamBranchLifecycle.isOperational(branchById.get(String(row.branch_id)), row.created_at || now));
    const totalSales = todayReports.reduce((s, r) => s + (Number(r.total_sales) || 0), 0);

    document.getElementById('branch-count').textContent = branches.length;
    document.getElementById('today-sales').textContent = todayReportsRes.error ? 'غير متاح' : totalSales.toLocaleString('ar-EG') + ' ر.س';
    document.getElementById('open-issues').textContent = openIssuesRes.error ? 'غير متاح' : openIssues.length;

    let sumPct = 0;
    let comparableBranches = 0;
    let hasIncompleteProgress = false;

    dashboardRows = branches.map(branch => {
        const logsForBranch = todayLogs.filter(l => l.branch_id === branch.id);
        const progressAvailable = !todayLogsRes.error;
        const isRestroomEligibleBranch = ZamBranchLifecycle.isOperational(branch, now) &&
            !/(?:الحي|البرج)/.test(String(branch.name || ''));
        const templatesForBranch = templates.filter(template => {
            if (!ZamRestroomHourly.isRestroomHourlyTask(template)) return true;
            return !!restroomConfig?.is_active && restroomConfig.template_id === template.id && isRestroomEligibleBranch;
        });
        const progress = progressAvailable ? ZamChecklistDashboard.branchProgress({
            templates: templatesForBranch, branchId: branch.id, branchName: branch.name, branchHours: branch,
            logs: logsForBranch, now
        }) : { total: 0, done: 0, pct: null, hourlyTemplateCount: 0, incompleteHourly: false };
        const pct = progress.pct;
        if (pct !== null) { sumPct += pct; comparableBranches++; }
        if (progress.incompleteHourly) hasIncompleteProgress = true;
        const salesForBranch = todayReports.filter(r => r.branch_id === branch.id).reduce((s, r) => s + (Number(r.total_sales) || 0), 0);
        const color = pct === null ? 'text-on-surface-variant' : pct >= 80 ? 'text-tertiary-container' : pct >= 50 ? 'text-primary' : 'text-error';
        const barColor = pct === null ? 'bg-surface-container-highest' : pct >= 80 ? 'bg-tertiary-container' : pct >= 50 ? 'bg-primary' : 'bg-error';
        // الضغط على أي فرع من لوحة التحكم يفتح داشبورد الفرع التفصيلي لجميع الأدوار الإدارية.
        const branchPage = '../supervisor-dashboard/index.html';
        const branchHref = `${branchPage}?branch=${encodeURIComponent(branch.id)}&name=${encodeURIComponent(branch.name)}`;
        const branchName = dashboardEscape(branch.name);
        const progressText = !progressAvailable
            ? 'تعذر حساب الإنجاز — سجل التنفيذ غير متاح'
            : progress.incompleteHourly
                ? `${progress.done} من ${progress.total} مهمة غير ساعية؛ ${progress.hourlyTemplateCount} قالب ساعي غير محسوب — الإجمالي غير مكتمل`
                : pct === null ? 'لا توجد مهام مستحقة' : `${progress.done} من ${progress.total} مهمة مستحقة`;
        const progressLabel = progress.incompleteHourly ? 'غير مكتمل' : (pct === null ? '—' : `${pct}%`);
        const progressBarAttrs = pct === null ? 'aria-hidden="true"' : `role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="إنجاز ${branchName}"`;

        const html = `
        <a href="${branchHref}"
           class="block bg-surface-container-lowest border border-outline-variant rounded-xl p-md hover:shadow-md hover:border-primary transition-all">
            <div class="flex justify-between items-start mb-sm">
                <h3 class="font-title-md text-title-md text-on-surface">${branchName}</h3>
                <span class="text-xl font-bold ${color}">${progressLabel}</span>
            </div>
            <div class="w-full bg-surface-container-high rounded-full h-2 mb-sm">
                <div class="${barColor} h-2 rounded-full" style="width:${pct === null ? 0 : pct}%" ${progressBarAttrs}></div>
            </div>
            <div class="flex justify-between text-body-sm text-on-surface-variant">
                <span>${dashboardEscape(progressText)}</span>
                <span>${todayReportsRes.error ? 'مبيعات غير متاحة' : salesForBranch.toLocaleString('ar-EG') + ' ر.س اليوم'}</span>
            </div>
        </a>`;
        return { branch, pct, html };
    });
    cardsEl.setAttribute('aria-busy', 'false');
    renderBranchCards();
    const failedSources = [todayLogsRes.error && 'سجل التنفيذ', todayReportsRes.error && 'تقارير المبيعات', openIssuesRes.error && 'مشاكل الشفت'].filter(Boolean);
    stateEl.textContent = failedSources.length ? `بعض البيانات غير متاحة: ${failedSources.join('، ')}. الأرقام الأخرى تعرض السجلات المتاحة فقط.` : 'اكتمل تحديث بيانات لوحة الأداء.';

    document.getElementById('avg-completion').textContent = hasIncompleteProgress ? 'غير مكتمل' : (comparableBranches ? Math.round(sumPct / comparableBranches) + '%' : '—');
    } catch (err) {
        if (generation !== dashboardLoadGeneration) return;
        console.error(err);
        cardsEl.setAttribute('aria-busy', 'false');
        stateEl.textContent = 'تعذّر تحميل بيانات اللوحة. تحقق من الاتصال ثم أعد المحاولة.';
        cardsEl.innerHTML = '<p class="text-error text-body-sm bg-surface-container-lowest border border-error rounded-xl p-md" role="alert">لم نتمكن من تحميل قائمة الفروع أو القوالب.</p>';
    } finally {
        if (generation === dashboardLoadGeneration) cardsEl.setAttribute('aria-busy', 'false');
    }
}

function dashboardEscape(value) {
    return String(value ?? '').replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character]));
}

loadDashboard();


</script>
